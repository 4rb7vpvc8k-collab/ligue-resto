<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ligue Resto</title>
<style>
:root{--bg:#fff8f0;--card:#fff;--tx:#2b1d12;--mut:#8a7766;--ac:#ff6b35;--ac2:#ffe3d3;--bd:#f0e0d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1410;--card:#261e18;--tx:#f5ebe0;--mut:#a39080;--ac:#ff7a45;--ac2:#3a2a20;--bd:#3a2e24}}
:root[data-theme="dark"]{--bg:#1a1410;--card:#261e18;--tx:#f5ebe0;--mut:#a39080;--ac:#ff7a45;--ac2:#3a2a20;--bd:#3a2e24}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
body{max-width:520px;margin:0 auto;padding:0 14px 90px}
.hd{background:linear-gradient(135deg,#ff6b35,#ff3d6e);color:#fff;border-radius:0 0 24px 24px;padding:18px 16px 16px;margin:0 -14px 14px}
.hd h1{font-size:24px;margin:0}.hd div{opacity:.9;font-size:13px;margin-top:2px}
h2{font-size:16px;margin:14px 0 8px}
.sub{color:var(--mut);font-size:13px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{font-size:12px;color:var(--mut)}
.resto{font-weight:700;font-size:16px}
.stars{color:var(--ac);letter-spacing:1px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--ac2);border-radius:99px;padding:5px 10px;font-size:13px;border:1px solid transparent;color:var(--tx);font-family:inherit}
button.chip.on{border-color:var(--ac);background:var(--ac);color:#fff}
input,textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:16px;margin-bottom:8px}
textarea{min-height:70px;resize:vertical}
.btn{width:100%;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:700;font-family:inherit;margin-top:2px}
.btn.alt{background:var(--ac2);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);max-width:520px;margin:0 auto}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:11px;color:var(--mut);font-family:inherit}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--ac);font-weight:700}
.rate{display:flex;gap:4px;justify-content:center;margin:6px 0 12px}
.rate button{font-size:34px;background:none;border:0;opacity:.3;padding:2px}
.rate button.on{opacity:1}
.rank{display:flex;align-items:center;gap:10px}
.pos{font-size:24px;width:36px;text-align:center}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.code{font-size:24px;font-weight:800;letter-spacing:3px;text-align:center;color:var(--ac);margin:6px 0}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--ac2)}
</style>
</head>
<body>
<div class="hd"><h1>🍽️ Ligue Resto</h1><div id="hsub"></div></div>
<div id="app"></div>
<nav id="nav"></nav>
<script>
var STICKERS=["💩 Intoxication","🐌 Service escargot","🧊 Plat tiède","🤌 Chef’s kiss","🐜 Invités surprise","🤏 Portions de fourmi","💸 Addition salée","😭 J’ai pleuré de joie","🥶 Clim polaire","🏃 Je reviens demain","🍷 Vin de camping","🔥 Ça pique !"];
var S={tab:"feed",pseudo:"",uid:"",leagues:[],league:"",reviews:[],form:{note:0,st:[]},mode:"local",fdb:null,cdb:null,unsub:null,local:[]};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stars(n){return "★".repeat(n)+"☆".repeat(5-n)}
function go(t){S.tab=t;render()}
S.uid=ls("lr_uid")||("u"+Math.random().toString(36).slice(2,10));ls("lr_uid",S.uid);
S.pseudo=ls("lr_pseudo")||"";S.league=ls("lr_league")||"";
try{S.leagues=JSON.parse(ls("lr_leagues")||"[]")}catch(e){}
if(S.league&&S.leagues.indexOf(S.league)<0)S.leagues.push(S.league);
function nav(){var T=[["feed","🍽️","Fil"],["add","➕","Noter"],["rank","🏆","Classement"],["league","👥","Ligue"]];
document.getElementById("nav").innerHTML=T.map(function(t){return '<button class="'+(S.tab===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")}
function render(){nav();if(!S.league||!S.pseudo)S.tab="league";
document.getElementById("hsub").textContent=S.league?("Ligue "+S.league):"Note tes restos avec tes amis";
var h=S.tab==="feed"?feed():S.tab==="add"?add():S.tab==="rank"?rank():league();
document.getElementById("app").innerHTML=h}
function feed(){var r=S.reviews.slice().sort(function(a,b){return b.ts-a.ts});
if(!r.length)return '<div class="empty">Aucun avis pour l’instant.<br>Sois le premier à noter un resto 🍕</div>';
return r.map(function(x){var d=new Date(x.ts);return '<div class="card"><div class="row"><div class="resto">'+esc(x.resto)+'</div><div class="stars">'+stars(x.note)+'</div></div><div class="who">'+esc(x.pseudo)+' · '+d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+(x.addr?' · 📍 '+esc(x.addr):(x.lat?' · 📍 position':''))+'</div>'+(x.avis?'<div style="margin-top:8px">'+esc(x.avis)+'</div>':'')+'<div class="chips">'+(x.st||[]).map(function(s){return '<span class="chip">'+esc(s)+'</span>'}).join("")+'</div></div>'}).join("")}
function add(){var f=S.form;
return '<h2>J’ai mangé où ?</h2><input placeholder="Nom du restaurant" value="'+esc(f.resto||"")+'" oninput="S.form.resto=this.value"><input placeholder="Ville ou adresse (optionnel)" value="'+esc(f.addr||"")+'" oninput="S.form.addr=this.value"><button class="btn alt" onclick="locate()">'+(f.lat?'✅ Position enregistrée':'📍 Utiliser ma position')+'</button><div class="rate">'+[1,2,3,4,5].map(function(n){return '<button class="'+(f.note>=n?"on":"")+'" onclick="S.form.note='+n+';render()">⭐</button>'}).join("")+'</div><textarea placeholder="Ton avis (honnête, on ne dira rien…)" oninput="S.form.avis=this.value">'+esc(f.avis||"")+'</textarea><div class="sub">Colle des stickers :</div><div class="chips" style="margin:0 0 14px">'+STICKERS.map(function(s,i){return '<button class="chip '+(f.st.indexOf(s)>-1?"on":"")+'" onclick="tog('+i+')">'+esc(s)+'</button>'}).join("")+'</div><button class="btn" onclick="send()">Publier mon avis</button>'}
function tog(i){var s=STICKERS[i],a=S.form.st,k=a.indexOf(s);if(k>-1)a.splice(k,1);else a.push(s);render()}
function locate(){try{navigator.geolocation.getCurrentPosition(function(p){S.form.lat=p.coords.latitude;S.form.lng=p.coords.longitude;render()},function(){alert("Localisation indisponible. Autorise-la dans les réglages, ou écris l’adresse.")})}catch(e){alert("Localisation indisponible ici.")}}
function send(){var f=S.form;if(!(f.resto||"").trim()||!f.note){alert("Il faut un nom de resto et une note !");return}
var r={league:S.league,uid:S.uid,pseudo:S.pseudo,resto:f.resto.trim(),note:f.note,avis:(f.avis||"").trim(),addr:(f.addr||"").trim(),st:f.st.slice(),ts:Date.now()};
if(f.lat){r.lat=f.lat;r.lng=f.lng}
S.form={note:0,st:[]};
function fail(){alert("Envoi impossible, réessaie.")}
if(S.mode==="firebase")S.fdb.collection("reviews").add(r).catch(fail);
else if(S.mode==="claude")S.cdb.collection("reviews").add(r).catch(fail);
else{S.reviews.push(r);S.local.push(r);ls("lr_local",JSON.stringify(S.local))}
S.tab="feed";render()}
function rank(){var now=new Date(),m=now.getMonth(),y=now.getFullYear(),g={};
S.reviews.forEach(function(x){var d=new Date(x.ts);if(d.getMonth()!==m||d.getFullYear()!==y)return;var k=x.resto.toLowerCase().trim();(g[k]=g[k]||{n:x.resto,s:0,c:0});g[k].s+=x.note;g[k].c++});
var L=Object.keys(g).map(function(k){return{n:g[k].n,avg:g[k].s/g[k].c,c:g[k].c}}).sort(function(a,b){return b.avg-a.avg||b.c-a.c});
var h='<h2>Classement de '+esc(now.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}))+'</h2>';
if(!L.length)return h+'<div class="empty">Pas encore de classement ce mois-ci.</div>';
var med=["🥇","🥈","🥉"];
return h+L.map(function(x,i){return '<div class="card rank"><div class="pos">'+(med[i]||(i+1))+'</div><div style="flex:1"><div class="resto">'+esc(x.n)+'</div><div class="who">'+x.c+' avis</div></div><div><div class="stars">'+stars(Math.round(x.avg))+'</div><div class="who" style="text-align:right">'+x.avg.toFixed(1)+'/5</div></div></div>'}).join("")}
function league(){var h='<h2>Mon profil</h2><div class="card"><input id="ps" placeholder="Ton pseudo (ex : Léo)" value="'+esc(S.pseudo)+'"><input id="lg" placeholder="Code d’une ligue à créer ou rejoindre" autocapitalize="characters"><button class="btn" onclick="join()">Créer / rejoindre</button></div>';
if(S.leagues.length){h+='<h2>Mes ligues</h2>'+S.leagues.map(function(c){return '<div class="card row"><div><b>'+esc(c)+'</b>'+(c===S.league?' <span class="tag">active</span>':'')+'</div><div style="display:flex;gap:6px">'+(c===S.league?'':'<button class="chip" onclick="pick(\''+esc(c)+'\')">Ouvrir</button>')+'<button class="chip" onclick="share(\''+esc(c)+'\')">Inviter</button></div></div>'}).join("")}
h+='<h2>Mode</h2><div class="card"><div class="sub">'+(S.mode==="firebase"?"✅ Connecté à Firebase : les avis sont partagés en ligne.":S.mode==="claude"?"Mode test Claude.":"Mode local : les avis restent sur cet appareil.")+'</div><button class="btn alt" onclick="cfg()">'+(S.mode==="firebase"?"Changer la config Firebase":"Connecter Firebase")+'</button></div>';
return h}
function join(){var p=document.getElementById("ps").value.trim(),l=document.getElementById("lg").value.trim().toUpperCase().replace(/\s+/g,"-");
if(!p){alert("Il faut un pseudo");return}
S.pseudo=p;ls("lr_pseudo",p);if(l)pick(l,true);else if(!S.league){alert("Entre un code de ligue");return}else render()}
function pick(l,isNew){S.league=l;if(S.leagues.indexOf(l)<0)S.leagues.push(l);ls("lr_league",l);ls("lr_leagues",JSON.stringify(S.leagues));S.tab="feed";S.reviews=S.mode==="local"?S.local.filter(function(x){return x.league===l}):[];listen();render()}
function share(c){var t="Rejoins ma ligue resto ! Code : "+c;try{if(navigator.share){navigator.share({text:t});return}}catch(e){}
try{navigator.clipboard.writeText(t);alert("Copié : "+t)}catch(e){prompt("Copie ce message :",t)}}
function listen(){if(S.unsub){try{S.unsub()}catch(e){}S.unsub=null}if(!S.league)return;
var cb=function(q){S.reviews=q.docs.map(function(d){return d.data()});render()};
if(S.mode==="firebase")S.unsub=S.fdb.collection("reviews").where("league","==",S.league).onSnapshot(cb,function(){});
else if(S.mode==="claude")S.unsub=S.cdb.collection("reviews").where("league","==",S.league).onSnapshot(cb,function(){})}
function parseCfg(t){var o={},re=/(\w+)\s*:\s*["']([^"']+)["']/g,m;while(m=re.exec(t))o[m[1]]=m[2];return(o.apiKey&&o.projectId)?o:null}
function cfg(){var t=prompt("Colle ici la config Firebase (le bloc firebaseConfig = { ... }) :");if(!t)return;var c=parseCfg(t);if(!c){alert("Config non reconnue. Colle tout le bloc, avec apiKey et projectId.");return}ls("lr_fb",JSON.stringify(c));location.reload()}
function loadScripts(u,i,done){if(i>=u.length){done();return}var s=document.createElement("script");s.src=u[i];s.onload=function(){loadScripts(u,i+1,done)};s.onerror=function(){};document.head.appendChild(s)}
function startFB(c){var base="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/";
loadScripts([base+"firebase-app-compat.min.js",base+"firebase-auth-compat.min.js",base+"firebase-firestore-compat.min.js"],0,function(){
try{firebase.initializeApp(c);firebase.auth().signInAnonymously().catch(function(){}).then(function(){S.fdb=firebase.firestore();S.mode="firebase";S.reviews=[];listen();render()})}catch(e){}})}
try{S.local=JSON.parse(ls("lr_local")||"[]");S.reviews=S.local.filter(function(x){return x.league===S.league})}catch(e){}
render();
var fbc=null;try{fbc=JSON.parse(ls("lr_fb")||"null")}catch(e){}
if(!fbc)fbc={apiKey:"AIzaSyBmMv9s1yxXhJTWVp5j2ows7QKEId4Z6sE",authDomain:"ligue-resto.firebaseapp.com",projectId:"ligue-resto",storageBucket:"ligue-resto.firebasestorage.app",messagingSenderId:"775462808060",appId:"1:775462808060:web:26b79836070b52cb56ea79"};
if(fbc)startFB(fbc);
else try{claude.use("db").then(function(d){if(d){S.cdb=d;S.mode="claude";S.reviews=[];listen();render()}}).catch(function(){})}catch(e){}
</script>
</body>
</html>

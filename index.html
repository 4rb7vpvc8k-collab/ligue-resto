<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ligue Resto</title>
<style>
:root{--bg:#fff8f0;--card:#fff;--tx:#2b1d12;--mut:#8a7766;--ac:#ff6b35;--ac2:#ffe3d3;--bd:#f0e0d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1410;--card:#261e18;--tx:#f5ebe0;--mut:#a39080;--ac:#ff7a45;--ac2:#3a2a20;--bd:#3a2e24}}
:root[data-theme="dark"]{--bg:#1a1410;--card:#261e18;--tx:#f5ebe0;--mut:#a39080;--ac:#ff7a45;--ac2:#3a2a20;--bd:#3a2e24}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
body{max-width:520px;margin:0 auto;padding:0 14px 90px}
.hd{background:linear-gradient(135deg,#ff6b35,#ff3d6e);color:#fff;border-radius:0 0 24px 24px;padding:18px 16px 16px;margin:0 -14px 14px}
.hd h1{font-size:24px;margin:0}.hd div{opacity:.9;font-size:13px;margin-top:2px}
h2{font-size:16px;margin:14px 0 8px}
.sub{color:var(--mut);font-size:13px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{font-size:12px;color:var(--mut)}
.resto{font-weight:700;font-size:16px}
.stars{color:var(--ac);letter-spacing:1px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--ac2);border-radius:99px;padding:5px 10px;font-size:13px;border:1px solid transparent;color:var(--tx);font-family:inherit}
button.chip.on{border-color:var(--ac);background:var(--ac);color:#fff}
input,textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:16px;margin-bottom:8px}
textarea{min-height:70px;resize:vertical}
.btn{width:100%;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:700;font-family:inherit;margin-top:2px}
.btn.alt{background:var(--ac2);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);max-width:520px;margin:0 auto}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:11px;color:var(--mut);font-family:inherit}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--ac);font-weight:700}
.rate{display:flex;gap:4px;justify-content:center;margin:6px 0 12px}
.rate button{font-size:34px;background:none;border:0;opacity:.3;padding:2px}
.rate button.on{opacity:1}
.rank{display:flex;align-items:center;gap:10px}
.pos{font-size:24px;width:36px;text-align:center}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.code{font-size:24px;font-weight:800;letter-spacing:3px;text-align:center;color:var(--ac);margin:6px 0}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--ac2)}
.seg{display:flex;gap:6px;margin:0 0 10px}.seg button{flex:1}.sr{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}.back{background:none;border:0;color:var(--ac);font-size:15px;font-weight:700;padding:6px 0;font-family:inherit}
</style>
</head>
<body>
<div class="hd"><h1>🍽️ Ligue Resto</h1><div id="hsub">Découvre et note les restos</div></div>
<div id="app"></div>
<nav id="nav"></nav>
<script>
var CFG={apiKey:"AIzaSyBmMv9s1yxXhJTWVp5j2ows7QKEId4Z6sE",authDomain:"ligue-resto.firebaseapp.com",projectId:"ligue-resto",storageBucket:"ligue-resto.firebasestorage.app",messagingSenderId:"775462808060",appId:"1:775462808060:web:26b79836070b52cb56ea79"};
var STICKERS=["💩 Intoxication","🐌 Service escargot","🧊 Plat tiède","🤌 Chef’s kiss","🐜 Invités surprise","🤏 Portions de fourmi","💸 Addition salée","😭 J’ai pleuré de joie","🥶 Clim polaire","🏃 Je reviens demain","🍷 Vin de camping","🔥 Ça pique !"];
var S={tab:"explore",q:"",open:null,gl:[],lv:"feed",pseudo:"",uid:"",leagues:[],league:"",all:[],priv:{},unsubs:{},form:{note:0,st:[],vis:"pub"},fdb:null,state:"loading"};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stars(n){n=Math.round(n);return "★".repeat(n)+"☆".repeat(5-n)}
function lg(x){return x.leagues||(x.league?[x.league]:[])}
function go(t){S.tab=t;S.open=null;render()}
S.uid=ls("lr_uid")||("u"+Math.random().toString(36).slice(2,10));ls("lr_uid",S.uid);
S.pseudo=ls("lr_pseudo")||"";S.league=ls("lr_league")||"";
try{S.leagues=JSON.parse(ls("lr_leagues")||"[]")}catch(e){}
if(S.league&&S.leagues.indexOf(S.league)<0)S.leagues.push(S.league);
function save(){ls("lr_pseudo",S.pseudo);ls("lr_league",S.league);ls("lr_leagues",JSON.stringify(S.leagues))}
function nav(){var T=[["explore","🔎","Explorer"],["add","➕","Noter"],["league","👥","Ligue"],["me","⚙️","Profil"]];
document.getElementById("nav").innerHTML=T.map(function(t){return '<button class="'+(S.tab===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")}
function render(){nav();if(!S.pseudo)S.tab="me";
document.getElementById("hsub").textContent=S.tab==="league"&&S.league?("Ligue "+S.league):"Découvre et note les restos";
var h=S.tab==="explore"?explore():S.tab==="add"?add():S.tab==="league"?league():me();
document.getElementById("app").innerHTML=h}
function status(){return S.state==="loading"?'<div class="sub">Connexion…</div>':S.state==="error"?'<div class="sub">⚠️ Connexion impossible. Recharge la page.</div>':""}
function rc(x,showR){var d=new Date(x.ts),mine=S.leagues.some(function(l){return lg(x).indexOf(l)>-1})&&x.uid!==S.uid;
return '<div class="card"><div class="row"><div class="resto">'+esc(showR?x.resto:x.pseudo)+'</div><div class="stars">'+stars(x.note)+'</div></div><div class="who">'+(showR?esc(x.pseudo)+' · ':'')+d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+(x.addr?' · 📍 '+esc(x.addr):(x.lat?' · 📍 position':''))+(x._p?' · <span class="tag">🔒 ligue seulement</span>':mine?' · <span class="tag">👥 ligue</span>':'')+'</div>'+(x.avis?'<div style="margin-top:8px">'+esc(x.avis)+'</div>':'')+'<div class="chips">'+(x.st||[]).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join("")+'</div></div>'}
function groups(list,q){var g={};q=(q||"").toLowerCase().trim();
list.forEach(function(x){var k=x.resto.toLowerCase().trim();if(q&&k.indexOf(q)<0&&(x.addr||"").toLowerCase().indexOf(q)<0)return;var o=g[k]=g[k]||{n:x.resto,a:"",s:0,c:0,t:0,rv:[]};o.s+=x.note;o.c++;o.rv.push(x);if(x.addr)o.a=x.addr;if(x.ts>o.t)o.t=x.ts});
return Object.keys(g).map(function(k){return g[k]}).sort(function(a,b){return b.t-a.t})}
function results(){var G=S.gl=groups(allv(),S.q);
if(!G.length)return '<div class="empty">'+(S.q?'Aucun resto trouvé.<br><br><button class="btn" onclick="S.form.resto=S.q;go(\'add\')">Noter « '+esc(S.q)+' »</button>':S.state==="loading"?'Chargement…':'Aucun avis pour l’instant.<br>Sois le premier à noter un resto 🍕')+'</div>';
return G.map(function(o,i){return '<div class="card" onclick="S.open='+i+';render()"><div class="row"><div class="resto">'+esc(o.n)+'</div><div class="stars">'+stars(o.s/o.c)+'</div></div><div class="who">'+(o.a?'📍 '+esc(o.a)+' · ':'')+o.c+' avis · '+(o.s/o.c).toFixed(1)+'/5</div></div>'}).join("")}
function explore(){if(S.open!==null&&S.gl[S.open]){var o=S.gl[S.open];
return '<button class="back" onclick="S.open=null;render()">← Retour</button><div class="card"><div class="resto" style="font-size:20px">'+esc(o.n)+'</div><div class="stars" style="font-size:20px">'+stars(o.s/o.c)+' <span class="who">'+(o.s/o.c).toFixed(1)+'/5 · '+o.c+' avis</span></div>'+(o.a?'<div class="who">📍 '+esc(o.a)+'</div>':'')+'<button class="btn" style="margin-top:10px" onclick="S.form.resto=\''+o.n.replace(/\\/g,"").replace(/'/g,"")+'\';S.form.addr=\''+o.a.replace(/\\/g,"").replace(/'/g,"")+'\';go(\'add\')">Noter ce resto</button></div>'+o.rv.sort(function(a,b){return b.ts-a.ts}).map(function(x){return rc(x,false)}).join("")}
return status()+'<div class="sr"><input id="q" placeholder="🔎 Cherche un resto ou une ville" value="'+esc(S.q)+'" oninput="S.q=this.value;document.getElementById(\'res\').innerHTML=results()" style="margin:0"></div><div id="res">'+results()+'</div>'}
function add(){var f=S.form;
return '<h2>J’ai mangé où ?</h2><input placeholder="Nom du restaurant" value="'+esc(f.resto||"")+'" oninput="S.form.resto=this.value"><input placeholder="Ville ou adresse (optionnel)" value="'+esc(f.addr||"")+'" oninput="S.form.addr=this.value"><button class="btn alt" onclick="locate()">'+(f.lat?'✅ Position enregistrée':'📍 Utiliser ma position')+'</button><div class="rate">'+[1,2,3,4,5].map(function(n){return '<button class="'+(f.note>=n?"on":"")+'" onclick="S.form.note='+n+';render()">⭐</button>'}).join("")+'</div><textarea placeholder="Ton avis (honnête, on ne dira rien…)" oninput="S.form.avis=this.value">'+esc(f.avis||"")+'</textarea><div class="sub">Colle des stickers :</div><div class="chips" style="margin:0 0 14px">'+STICKERS.map(function(s,i){return '<button class="chip '+(f.st.indexOf(s)>-1?"on":"")+'" onclick="tog('+i+')">'+esc(s)+'</button>'}).join("")+'</div>'+'<div class="sub">Qui peut voir cet avis ?</div><div class="seg"><button class="chip '+(f.vis!=="lg"?"on":"")+'" onclick="S.form.vis=\'pub\';render()">🌍 Tout le monde</button><button class="chip '+(f.vis==="lg"?"on":"")+'" onclick="S.form.vis=\'lg\';render()">🔒 Ma ligue seulement</button></div>'+(f.vis==="lg"?(S.leagues.length?'<div class="chips" style="margin:0 0 12px">'+S.leagues.map(function(c){return '<button class="chip '+((f.tl||S.league)===c?"on":"")+'" onclick="S.form.tl=\''+esc(c)+'\';render()">'+esc(c)+'</button>'}).join("")+'</div>':'<div class="sub">⚠️ Tu n’as pas encore de ligue. Crée-en une dans l’onglet Ligue.</div>'):'')+'<div style="height:6px"></div><button class="btn" onclick="send()">Publier mon avis</button>'}
function tog(i){var s=STICKERS[i],a=S.form.st,k=a.indexOf(s);if(k>-1)a.splice(k,1);else a.push(s);render()}
function locate(){try{navigator.geolocation.getCurrentPosition(function(p){S.form.lat=p.coords.latitude;S.form.lng=p.coords.longitude;render()},function(){alert("Localisation indisponible. Autorise-la dans les réglages, ou écris l’adresse.")})}catch(e){alert("Localisation indisponible ici.")}}
function send(){var f=S.form;if(!(f.resto||"").trim()||!f.note){alert("Il faut un nom de resto et une note !");return}
if(!S.fdb){alert("Pas de connexion, réessaie dans un instant.");return}
var priv=f.vis==="lg",tl=f.tl||S.league;
if(priv&&!tl){alert("Crée ou rejoins d’abord une ligue (onglet Ligue).");return}
var r={uid:S.uid,pseudo:S.pseudo,resto:f.resto.trim(),note:f.note,avis:(f.avis||"").trim(),addr:(f.addr||"").trim(),st:f.st.slice(),leagues:priv?[tl]:S.leagues.slice(),ts:Date.now()};
if(priv)r.pub=false;
if(f.lat){r.lat=f.lat;r.lng=f.lng}
var col=priv?S.fdb.collection("leagues/"+tl+"/reviews"):S.fdb.collection("reviews");
col.add(r).then(function(){S.form={note:0,st:[],vis:f.vis};S.q="";if(priv){S.league=tl;S.lv="feed";save();S.tab="league"}else S.tab="explore";render()}).catch(function(){alert("Envoi impossible, réessaie.")})}
function rank(list){var now=new Date(),m=now.getMonth(),y=now.getFullYear();
var G=groups(list.filter(function(x){var d=new Date(x.ts);return d.getMonth()===m&&d.getFullYear()===y}),"").sort(function(a,b){return b.s/b.c-a.s/a.c||b.c-a.c});
var h='<h2>Classement de '+esc(now.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}))+'</h2>';
if(!G.length)return h+'<div class="empty">Pas encore de classement ce mois-ci.</div>';
var med=["🥇","🥈","🥉"];
return h+G.map(function(x,i){return '<div class="card rank"><div class="pos">'+(med[i]||(i+1))+'</div><div style="flex:1"><div class="resto">'+esc(x.n)+'</div><div class="who">'+x.c+' avis</div></div><div><div class="stars">'+stars(x.s/x.c)+'</div><div class="who" style="text-align:right">'+(x.s/x.c).toFixed(1)+'/5</div></div></div>'}).join("")}
function league(){
var join='<div class="card"><input id="lg" placeholder="Code d’une ligue à créer ou rejoindre" autocapitalize="characters"><button class="btn" onclick="join()">Créer / rejoindre</button></div>';
if(!S.leagues.length)return '<h2>Ma ligue</h2><div class="sub">Crée une ligue avec tes amis pour voir leurs avis et faire un classement du mois. Invente un code (ex : LES-GOURMANDS) et partage-le.</div>'+join;
var L=lrev(S.league).sort(function(a,b){return b.ts-a.ts});
var h='<div class="chips" style="margin:0 0 10px">'+S.leagues.map(function(c){return '<button class="chip '+(c===S.league?"on":"")+'" onclick="pick(\''+esc(c)+'\')">'+esc(c)+'</button>'}).join("")+'</div>';
h+='<div class="seg"><button class="chip '+(S.lv==="feed"?"on":"")+'" onclick="S.lv=\'feed\';render()">Fil</button><button class="chip '+(S.lv==="rank"?"on":"")+'" onclick="S.lv=\'rank\';render()">Classement</button><button class="chip" onclick="share(\''+esc(S.league)+'\')">Inviter</button></div>';
if(S.lv==="rank")return h+rank(L);
return h+(L.length?L.map(function(x){return rc(x,true)}).join(""):'<div class="empty">Aucun avis dans cette ligue.<br>Note un resto : tes avis publics et ceux réservés à la ligue apparaîtront ici 🍕</div>')+'<h2>Rejoindre une autre ligue</h2>'+join}
function join(){var l=document.getElementById("lg").value.trim().toUpperCase().replace(/\s+/g,"-").replace(/[\/.]/g,"");if(!l){alert("Entre un code");return}pick(l)}
function pick(l){S.league=l;if(S.leagues.indexOf(l)<0)S.leagues.push(l);save();subL();S.tab="league";render()}
function share(c){var t="Rejoins ma ligue resto ! Code : "+c;try{if(navigator.share){navigator.share({text:t});return}}catch(e){}
try{navigator.clipboard.writeText(t);alert("Copié : "+t)}catch(e){prompt("Copie ce message :",t)}}
function me(){return '<h2>Mon profil</h2><div class="card"><input id="ps" placeholder="Ton pseudo (ex : Léo)" value="'+esc(S.pseudo)+'"><button class="btn" onclick="setP()">Enregistrer</button></div>'+(S.leagues.length?'<h2>Mes ligues</h2>'+S.leagues.map(function(c){return '<div class="card row"><b>'+esc(c)+'</b><button class="chip" onclick="share(\''+esc(c)+'\')">Inviter</button></div>'}).join(""):'')+'<div class="sub" style="margin-top:12px">'+(S.state==="ready"?"✅ Connecté : les avis sont partagés en ligne.":S.state==="error"?"⚠️ Connexion impossible.":"Connexion…")+'</div>'}
function setP(){var p=document.getElementById("ps").value.trim();if(!p){alert("Il faut un pseudo");return}S.pseudo=p;save();S.tab="explore";render()}
function allv(){var a=S.all.slice();Object.keys(S.priv).forEach(function(c){a=a.concat(S.priv[c])});return a}
function lrev(c){return S.all.filter(function(x){return lg(x).indexOf(c)>-1}).concat(S.priv[c]||[])}
function refresh(){if(S.tab==="explore"&&S.open===null&&document.getElementById("res"))document.getElementById("res").innerHTML=results();else if(S.tab==="explore"||S.tab==="league")render()}
function subL(){if(!S.fdb)return;S.leagues.forEach(function(c){if(S.unsubs[c])return;S.unsubs[c]=S.fdb.collection("leagues/"+c+"/reviews").onSnapshot(function(q){S.priv[c]=q.docs.map(function(d){var x=d.data();x._p=1;return x});refresh()},function(){})})}
function loadScripts(u,i,done){if(i>=u.length){done();return}var s=document.createElement("script");s.src=u[i];s.onload=function(){loadScripts(u,i+1,done)};s.onerror=function(){S.state="error";render()};document.head.appendChild(s)}
var base="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/";
render();
loadScripts([base+"firebase-app-compat.min.js",base+"firebase-auth-compat.min.js",base+"firebase-firestore-compat.min.js"],0,function(){
try{firebase.initializeApp(CFG);firebase.auth().signInAnonymously().then(function(){
S.fdb=firebase.firestore();S.state="ready";
S.fdb.collection("reviews").orderBy("ts","desc").limit(300).onSnapshot(function(q){S.all=q.docs.map(function(d){return d.data()});S.state="ready";refresh()},function(){S.state="error";render()});subL()
}).catch(function(){S.state="error";render()})}catch(e){S.state="error";render()}});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belly</title>
<meta name="theme-color" content="#E5B83F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Belly">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="IMG_4287.jpeg">
<link rel="apple-touch-icon" href="IMG_4287.jpeg">
<style>
:root{--bg:#F4F1E9;--card:#F4F1E9;--tx:#192A3A;--mut:rgba(25,42,58,.62);--ac:#E5B83F;--ac2:rgba(25,42,58,.08);--bd:rgba(25,42,58,.2);box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}

/* Base & Layout */
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
body{max-width:520px;margin:25px auto 0;padding:0 14px 90px}
h2{font-size:16px;margin:14px 0 8px}
.sub{color:var(--mut);font-size:13px;margin-bottom:8px}
.big{font-size:32px;font-weight:900;margin:14px 0 0}
.sh{margin:18px 0 8px;font-size:20px;font-weight:800}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}
.code{font-size:24px;font-weight:800;letter-spacing:3px;text-align:center;color:var(--ac);margin:6px 0}
.dist{color:var(--tx);font-weight:700}
.svg-icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;display:inline-block}

/* Header & Nav */
.hd{background:var(--ac);color:#192A3A;border-radius:0 0 16px 16px;padding:18px 16px 16px;margin:0 -14px 14px}
.hd h1{font-size:24px;margin:0}.hd div{opacity:.9;font-size:13px;margin-top:2px}
.sr{position:sticky;top:0;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;padding:8px 0 6px;z-index:10}
.sr::before,.sr::after{display:none !important;content:none !important}
.back{background:none;border:0;color:var(--tx);font-size:15px;font-weight:700;padding:6px 0;font-family:inherit;cursor:pointer}
nav{position:fixed !important;left:0 !important;right:0 !important;bottom:0 !important;display:flex !important;flex-direction:row !important;background:#161B22 !important;border-top:1px solid rgba(255,255,255,.1) !important;padding-bottom:env(safe-area-inset-bottom,0px) !important;max-width:520px;margin:0 auto;z-index:100}
nav button{flex:1 1 0% !important;min-width:0;border:0;background:none;padding:8px 0 32px !important;font-size:11px;line-height:1.15;color:rgba(244,241,233,.65);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav button svg{width:20px;height:20px;stroke:currentColor !important;fill:none !important;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
nav button.on{color:#E5B83F !important;font-weight:700}

/* Formulaires & Contrôles */
input,textarea{width:100%;padding:11px;border-radius:4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:16px;margin-bottom:8px}
textarea{min-height:70px;resize:vertical}
.btn{width:100%;background:var(--ac);color:#192A3A;border:0;border-radius:4px;padding:13px;font-size:16px;font-weight:700;font-family:inherit;margin-top:2px;cursor:pointer}
.btn.alt{background:var(--ac2);color:var(--tx)}
.tri .btn{flex:1;padding:11px 4px;font-size:14px;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row2{display:flex;gap:8px;align-items:center}.row2 input{margin:0}.row2 .btn{width:auto;padding:11px 16px;margin:0}
.seg{display:flex;gap:6px;margin:10px 0 14px}.seg button{flex:1;border-radius:4px}
.tabs{display:flex;background:var(--ac2);border-radius:4px;padding:4px;margin:8px 0 12px}
.tabs button{flex:1;border:0;background:none;padding:10px 0;border-radius:4px;font-size:15px;font-weight:700;color:var(--mut);font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#192A3A}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--ac2);border-radius:4px;padding:5px 10px;font-size:13px;border:1px solid transparent;color:var(--tx);font-family:inherit;cursor:pointer}
button.chip.on{border-color:var(--ac);background:var(--ac);color:#192A3A}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:4px;background:var(--ac2)}
.gear{background:none;border:0;font-size:20px;width:34px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--tx)}
.gear svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Cartes & Avis */
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card.asym{border-radius:12px 4px 12px 4px}
.card.strict{border-radius:4px;padding:6px 10px;margin-bottom:6px}
.who{font-size:12px;color:var(--mut)}
.resto{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.dot-badge{width:10px;height:10px;border-radius:2px;display:inline-block;flex-shrink:0}
.stars{color:var(--ac);letter-spacing:1px;white-space:nowrap}
.rate{display:flex;gap:4px;justify-content:center;width:max-content;margin:6px auto 4px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.rate button{font-size:34px;background:none;border:0;opacity:.3;padding:2px}.rate button.on{opacity:1}
.st{display:inline-block;position:relative;margin-right:1px}.sb{color:var(--mut);opacity:.35}.sf{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--ac)}.rs{font-size:42px;line-height:1;padding:0 2px;cursor:pointer}
.act{display:flex;gap:18px;justify-content:flex-end;margin-top:8px}.act a{color:var(--mut);font-size:12px;cursor:pointer}
.resto-main-card{background:#192A3A;color:#F4F1E9;border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 24px rgba(0,0,0,.15);border-radius:14px;padding:16px;margin-bottom:14px}
.resto-main-card .resto,.resto-main-card .who,.resto-main-card div{color:#F4F1E9}
.resto-main-card .btn.alt{background:rgba(255,255,255,.1);color:#F4F1E9;border:1px solid rgba(255,255,255,.15)}

.review-layout{display:flex;gap:8px;align-items:flex-start;margin-top:1px}
.review-text{flex:1;font-size:12.5px;line-height:1.3;word-break:break-word}
.review-text-content{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis}
.card.strict .review-text.expanded .review-text-content{display:block;overflow:visible}
.review-thumb{width:48px;height:48px;min-width:48px;max-width:48px;border-radius:6px;object-fit:cover;cursor:pointer;flex-shrink:0;border:1px solid var(--bd);display:block}
.photo-container{position:relative;display:block;width:100%;margin-top:8px;border-radius:10px;overflow:hidden;background:#f5f2eb;border:1px solid var(--bd)}
.photo-preview{width:100%;height:220px;object-fit:cover;display:block}
.photo-del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;font-size:14px;z-index:10}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:pointer}
.lightbox img{max-width:90%;max-height:90%;border-radius:8px;object-fit:contain}

/* Carrousels, Podiums, Profil & Grilles */
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px 6px}.hs::-webkit-scrollbar{display:none}
.pc{flex:0 0 132px;scroll-snap-align:start}
.pt{height:176px;border-radius:6px;color:#F4F1E9;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pt b{font-size:38px;line-height:1;position:absolute;top:10px;left:10px;opacity:.9}.pt small{font-size:13px;font-weight:700;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.pm{margin-top:6px;font-size:12px;color:var(--mut)}.pm .stars{font-size:13px;display:block}
.cat-scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:4px 14px 10px}.cat-scroll::-webkit-scrollbar{display:none}
.cat-item{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;cursor:pointer;scroll-snap-align:start}
.cat-circle{width:68px;height:68px;border-radius:50%;overflow:hidden;border:2px solid var(--bd);box-shadow:0 2px 6px rgba(0,0,0,.08);background:#ddd}
.cat-circle img{width:100%;height:100%;object-fit:cover}
.cat-name{font-size:12px;font-weight:600;text-align:center;margin-top:5px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.av{width:64px;height:64px;border-radius:6px;background:var(--ac);color:#192A3A;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;cursor:pointer;position:relative}
.av.edit::after{content:'✎';position:absolute;bottom:-5px;right:-5px;background:#192A3A;color:#E5B83F;font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.rank{display:flex;align-items:center;gap:10px}.pos{font-size:24px;width:36px;text-align:center}
.podium{display:flex;align-items:flex-end;gap:8px;margin:8px 0}.pod{flex:1;border-radius:6px 6px 0 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:8px 4px;text-align:center;color:#192A3A;font-weight:700}
.pn{font-size:28px;font-weight:900}.pl{font-size:12px;line-height:1.15;word-break:break-word}
.pod2{display:flex;flex-direction:column;gap:8px}.pr{display:flex;align-items:center;gap:10px;border-radius:6px;padding:10px 12px;font-weight:700;color:#192A3A}
.lr{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-top:1px solid var(--bd);font-size:17px;cursor:pointer}.lr b{color:var(--mut);font-weight:600}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gr .pt{height:auto;aspect-ratio:2/3;padding:6px}.gr .pt b{font-size:22px;top:6px;left:6px}.gr .pt small{font-size:10px}
.mh{background:var(--ac2);padding:8px 14px;font-size:13px;letter-spacing:.1em;font-weight:700;margin:12px -14px 0}
.dr{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.dd{width:46px;height:46px;border:1px solid var(--bd);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--mut);flex:0 0 46px}
.dt{width:46px;height:62px;border-radius:4px;color:#F4F1E9;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 46px}
.di{flex:1;min-width:0}
.letterboxd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:4px 0}
.lb-card{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .2s}.lb-card:active{transform:scale(.98)}
.lb-poster{width:100%;height:160px;object-fit:cover;display:block}.lb-info{padding:8px;display:flex;flex-direction:column;gap:4px}
.lb-card.text-only{justify-content:center;align-items:center;text-align:center;min-height:160px;padding:14px}.lb-card.text-only .lb-resto{font-size:15px;margin-bottom:6px}

/* Amis, Profil & Cartes Accueil */
.bell-btn{position:relative;background:var(--ac2);border:1px solid rgba(25,42,58,.15);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);flex-shrink:0}
.bell-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bell-dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#DC2626;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.friend-row-card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.friend-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#F4F1E9;flex-shrink:0}
.friend-meta{flex:1;min-width:0;cursor:pointer}.friend-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.friend-sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(229,184,63,.22);color:var(--tx);margin-left:6px}
.prof-review-list{display:flex;flex-direction:column;gap:8px}
.prof-review-item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.prof-review-main{flex:1;min-width:0}.prof-review-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prof-review-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof-review-date{font-size:11px;color:var(--mut);flex-shrink:0}.prof-review-stars{font-size:12px;margin:2px 0}.prof-review-excerpt{font-size:12px;color:rgba(25,42,58,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof-review-thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid var(--bd)}
.home-review-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 16px rgba(0,0,0,.04);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}.home-review-card:active{transform:scale(.98)}
.home-review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.home-review-user{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--tx)}
.home-review-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#F4F1E9;flex-shrink:0}
.home-review-resto{font-weight:800;font-size:17px;color:var(--tx);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.home-review-comment{font-size:14px;color:var(--mut);line-height:1.4;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.home-review-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut)}

/* Map & Modales */
#map{height:38vh;min-height:240px;border-radius:6px;border:1px solid var(--bd);z-index:1;overflow:hidden}
.gm-style .gm-style-iw-c{color:#192A3A !important;font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:flex-end;transition:opacity .24s ease}.ov.closing{opacity:0}
.ovb{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@keyframes slideInLeftSheet{from{transform:translateX(-100%);opacity:.85}to{transform:translateX(0);opacity:1}}
.ovb.from-left{animation:slideInLeftSheet .28s cubic-bezier(.22,1,.36,1) forwards;transition:transform .25s cubic-bezier(.4,0,.2,1),opacity .25s ease}
.ovb.from-left.exit-right{transform:translateX(100%);opacity:0}
.lb-modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);display:flex;flex-direction:column;justify-content:flex-end;animation:fadeInModal .18s ease-out}
.lb-sheet{background:var(--bg);color:var(--tx);height:94vh;max-width:520px;width:100%;margin:0 auto;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:slideUpSheet .24s cubic-bezier(.22,1,.36,1)}
.lb-sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(25,42,58,.12)}
.lb-sheet-hd .cancel-btn{background:none;border:0;color:rgba(25,42,58,.65);font-size:16px;cursor:pointer;padding:0;font-family:inherit}.lb-sheet-hd .sheet-title{font-size:16px;font-weight:700}
.lb-sheet-search{padding:12px 16px 8px}.lb-sheet-search input{background:var(--ac2);border:1px solid rgba(25,42,58,.15);border-radius:10px;padding:10px 14px;font-size:16px;margin:0}
.lb-sheet-body{flex:1;overflow-y:auto;padding:8px 16px 40px}.lb-sheet-body .card{box-shadow:none !important;margin-bottom:10px !important;border-radius:10px !important}
.lb-recent-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(25,42,58,.5);margin:12px 0 6px}
.lb-recent-row{padding:13px 0;border-bottom:1px solid rgba(25,42,58,.1);font-size:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
@keyframes slideUpSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeInModal{from{opacity:0}to{opacity:1}}

/* Page Restaurant (.pg) */
.pg{animation:pgIn .3s ease;padding-bottom:140px}@keyframes pgIn{from{opacity:0}to{opacity:1}}
.pg-svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex-shrink:0}
.pg-hero{margin:0 -14px;padding:14px 18px 22px;min-height:295px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;border-radius:0 0 28px 28px;background-size:cover;background-position:center}
.pg-top{display:flex;justify-content:space-between;align-items:center}
.pg-ic{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.pg-ic:active{transform:scale(.86)}.pg-ic .pg-svg{width:20px;height:20px}.pg-ic.on .pg-svg{fill:currentColor}.pg-ic.heart.on{color:#ff5a6e}.pg-acts{display:flex;gap:10px}
.pg-cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:99px;margin-bottom:10px}
.pg-name{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
.pg-score{display:flex;align-items:baseline;gap:10px;margin-top:12px}.pg-big{font-size:44px;font-weight:800;line-height:1}.pg-score .stars{font-size:16px}.pg-cnt{font-size:13px;opacity:.75}
.pg-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 10px}.pg-tile{background:rgba(127,127,127,.1);border-radius:16px;padding:14px}
.pg-tile .l{display:flex;gap:6px;align-items:center;font-size:12px;opacity:.7;font-weight:600}.pg-tile .v{font-size:26px;font-weight:800;margin-top:6px;line-height:1}.pg-tile .n{font-size:12px;opacity:.6;margin-top:4px}
.pg-g{font-size:12px;opacity:.65;margin:0 2px 10px}
.pg-addr{display:flex;align-items:center;gap:12px;background:rgba(127,127,127,.1);border-radius:16px;padding:12px 14px}
.pg-addr-t{flex:1;min-width:0;font-size:14px;line-height:1.3}.pg-addr-t small{display:block;opacity:.6;font-size:12px;margin-top:2px}
.pg-mini{width:38px;height:38px;border-radius:12px;border:0;background:rgba(127,127,127,.14);color:inherit;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.pg-h{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px}.pg-h h3{margin:0;font-size:20px;font-weight:800}
.pg-seg{display:flex;gap:6px}.pg-pill{border:0;background:rgba(127,127,127,.12);color:inherit;font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.pg-pill.on{background:#192A3A;color:#F4F1E9}
.pg-rv{padding:16px 0;border-bottom:1px solid rgba(127,127,127,.2)}.pg-rv-top{display:flex;align-items:center;gap:10px}
.pg-av{width:36px;height:36px;border-radius:50%;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pg-rv-who{flex:1;min-width:0}.pg-rv-who b{font-size:14px}.pg-rv-who div{font-size:12px;opacity:.6;display:flex;gap:6px;align-items:center}

function getRestoCat(name,type,priceLunch,cuisineTag){
  var n=(name||"").toLowerCase();
  var c=(cuisineTag||"").toLowerCase();
  
  if(c.includes("ital") || n.includes("pizza") || n.includes("trattoria") || n.includes("pizzeria") || n.includes("pasta") || n.includes("osteria")) return "italian";
  if(c.includes("fran") || n.includes("bistrot français") || n.includes("brasserie")) return "french";
  if(c.includes("jap") || n.includes("sushi") || n.includes("ramen")) return "japanese";
  if(c.includes("asiat") || n.includes("chinois") || n.includes("thaï") || n.includes("wok")) return "asian";
  if(c.includes("orient") || n.includes("couscous") || n.includes("tajine")) return "oriental";
  if(c.includes("indi") || n.includes("curry")) return "indian";
  if(c.includes("veg") || n.includes("veggie") || n.includes("vegan") || n.includes("végétarien")) return "veggie";
  if(c.includes("mexic") || n.includes("tacos") || n.includes("burrito")) return "mexican";
  if(c.includes("mer") || c.includes("seafood") || n.includes("huître") || n.includes("huitre") || n.includes("poisson") || n.includes("crustacé") || n.includes("homard") || n.includes("marée")) return "seafood";

  if(priceLunch && priceLunch > 25) return "trad_high";
  if(type==="fast_food"||/tacos|kebab|burger|fast|pizza|sandwich|snack|boulangerie/.test(n))return "fast";
  if(/gastrono|michelin|palace|etoile|étoile|prestige/.test(n))return "gastronomy";
  if(/bistro|comptoir|brasserie/.test(n))return "bistro";
  if(/gastronomique|chic|chateau|château|grand |maison |table |auberge/.test(n))return "trad_high";
  return "trad_low"
}

function getStyleKey(cat){

  return "trad_low";

function sortReviewsBy(list, mode){
  var arr = (list || []).slice();
  if(mode === "best"){
    return arr.sort(function(a,b){ return (b.note||0) - (a.note||0) || (b.ts||0) - (a.ts||0); });
  }
  if(mode === "worst"){
    return arr.sort(function(a,b){ return (a.note||0) - (b.note||0) || (b.ts||0) - (a.ts||0); });
  }

// --- Unicité des pseudos ---
function normalizePseudoKey(p){
  return String(p||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9_.-]+/g,"_");
}

function claimPseudo(newPseudo, callback){
  var clean = String(newPseudo||"").trim();
  if(!clean){ callback(false, "Pseudo requis."); return; }
  if(clean.length > 30){ callback(false, "Pseudo trop long (30 caractères max)."); return; }
  var key = normalizePseudoKey(clean);
  if(!key){ callback(false, "Utilise des lettres ou chiffres pour ton pseudo."); return; }
  if(!S.fdb || !S.user || S.user.isAnonymous){
    callback(true, clean);
    return;
  }
  var docRef = S.fdb.collection("pseudos").doc(key);
  S.fdb.runTransaction(function(tx){
    return tx.get(docRef).then(function(snap){
      if(snap.exists && snap.data().uid && snap.data().uid !== S.user.uid){
        throw new Error("TAKEN");
      }
      var oldKey = S.pseudo ? normalizePseudoKey(S.pseudo) : "";
      if(oldKey && oldKey !== key){
        var oldRef = S.fdb.collection("pseudos").doc(oldKey);
        tx.delete(oldRef);
      }
      tx.set(docRef, {uid: S.user.uid, pseudo: clean, updatedAt: Date.now()});
    });
  }).then(function(){
    callback(true, clean);
  }).catch(function(err){
    if(err && err.message === "TAKEN"){
      callback(false, "Ce nom d'utilisateur est déjà pris. Choisis-en un autre !");
    } else {
      callback(false, "Impossible de vérifier la disponibilité du pseudo pour le moment.");
    }
  });
}

function genUniqueLeagueCode(){
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  for(var j = 0; j < 4; j++) part2 += chars.charAt(Math.floor(Math.random() * chars.length));
  return "LG-" + part1 + "-" + part2;
}

function keyOf(p){return p.pid||("n:"+p.n.toLowerCase().trim())}
function gmap(list){var g={};list.forEach(function(x){var k=x.pid||("n:"+x.resto.toLowerCase().trim());var gpId=x.gPlaceId||(x.pid&&x.pid.indexOf("gp:")===0?x.pid.slice(3):null);var o=g[k]=g[k]||{k:k,pid:x.pid,gPlaceId:gpId,n:x.resto,a:"",s:0,c:0,sp:0,cp:0,sd:0,cd:0,t:0,cat:x.cat||getRestoCat(x.resto,x.type,x.priceLunch,x.cuisine),cuisine:x.cuisine||"",gPhoto:x.gPhoto||"",rv:[]};if(x.gPhoto&&!o.gPhoto)o.gPhoto=x.gPhoto;o.s+=x.note;o.c++;if(x.mode==="deliv"){o.sd+=x.note;o.cd++}else{o.sp+=x.note;o.cp++}o.rv.push(x);if(x.addr)o.a=x.addr;if(num(x.lat)&&num(x.lng)){o.lat=x.lat;o.lng=x.lng}if(x.ts>o.t)o.t=x.ts});return g}
function groups(list){var g=gmap(list);return Object.keys(g).map(function(k){return g[k]}).sort(function(a,b){return b.t-a.t})}

function sortP(arr){var g=gmap(allv());arr.forEach(function(p){var o=g[keyOf(p)];p.c=o?o.c:0;p.avg=o?o.s/o.c:-1;if(o&&o.cat)p.cat=o.cat;else if(!p.cat)p.cat=getRestoCat(p.n,p.type,p.priceLunch,p.cuisine);p.d=(S.loc&&num(p.lat)&&num(p.lng))?dist(S.loc.lat,S.loc.lng,p.lat,p.lng):(S.sc&&num(p.lat)&&num(p.lng))?dist(S.sc.lat,S.sc.lng,p.lat,p.lng):null});
return arr.sort(function(a,b){
  var so = S.filt.sort;
  if(so === "near") {
    function da(x){return x.d!=null?x.d:(x.dc!=null?x.dc:1e9)}
    return da(a)-da(b);
  }
  if(so === "worst") {
    var ax=a.avg<0?99:a.avg, ay=b.avg<0?99:b.avg;
    return ax-ay || ((a.d!=null?a.d:0)-(b.d!=null?b.d:0));
  }
  if(b.avg !== a.avg) return b.avg - a.avg;
  function dxy(x){return x.d!=null?x.d:(x.dc!=null?x.dc:1e9)}
  return dxy(a) - dxy(b);
})}

function strip(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim()}

var gmapsPromise = null;
function loadGoogleMaps(cb){
  if(window.google && window.google.maps && window.google.maps.places){ cb(); return; }
  if(!gmapsPromise){
    gmapsPromise = new Promise(function(resolve, reject){
      window._gmapsReady = function(){ resolve(); };
      var s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(GMAPS_KEY) + "&libraries=places&language=fr&region=FR&callback=_gmapsReady";
      s.async = true;
      s.onerror = function(){ gmapsPromise = null; reject(); };
      document.head.appendChild(s);
    });
  }
  gmapsPromise.then(cb).catch(function(){});
}

function priceLevelNewToCat(name, types, priceLevel){
  if(priceLevel === "PRICE_LEVEL_VERY_EXPENSIVE" || priceLevel === 4) return "gastronomy";
  if(priceLevel === "PRICE_LEVEL_EXPENSIVE" || priceLevel === 3) return "trad_high";
  if(priceLevel === "PRICE_LEVEL_INEXPENSIVE" || priceLevel === 1) return "fast";
  var t = (types || []).indexOf("meal_takeaway") > -1 ? "fast_food" : "restaurant";
  return getRestoCat(name, t, (priceLevel === "PRICE_LEVEL_MODERATE" || priceLevel === 2) ? 20 : null, "");
}

function mapNewPlaceToBelly(r){
  var lat = r.location ? (typeof r.location.lat === "function" ? r.location.lat() : r.location.lat) : null;
  var lng = r.location ? (typeof r.location.lng === "function" ? r.location.lng() : r.location.lng) : null;
  var n = r.displayName || "Restaurant";
  var addr = r.formattedAddress || "";
  var cat = priceLevelNewToCat(n, r.types, r.priceLevel);
  var gPhoto = (r.photos && r.photos.length && r.photos[0].getURI) ? r.photos[0].getURI({maxWidth: 600}) : "";
  return {
    pid: "gp:" + r.id,
    gPlaceId: r.id,
    n: n,
    a: addr,
    lat: lat,
    lng: lng,
    type: (r.types || [])[0] || "restaurant",
    cuisine: "",
    cat: cat,
    gRating: r.rating || null,
    gCount: r.userRatingCount || 0,
    gPhoto: gPhoto
  };
}

function searchPlaces(q){
  S.mapC = null;
  S.smode = "poi";
  S.sc = null;
  S.slabel = "";
  var center = S.loc || S.home || {lat:48.8566, lng:2.3522};
  var rad = Math.max(S.filt.rad || 3000, 500);

  function mergeCommunity(list){
    var seen = {};
    list.forEach(function(p){ seen[keyOf(p)] = 1; });
    groups(allv()).forEach(function(o){
      if(seen[o.k]) return;
      var matchQ = !q || strip(o.n).indexOf(strip(q)) > -1 || strip(o.a).indexOf(strip(q)) > -1;
      var okDist = !num(o.lat) || !num(o.lng) || dist(center.lat, center.lng, o.lat, o.lng)*1000 <= rad * 2;
      if(matchQ && okDist){
        list.push({pid:o.pid, n:o.n, a:o.a, lat:o.lat, lng:o.lng, cat:o.cat, cuisine:o.cuisine||""});
      }
    });
    return list;
  }

  return new Promise(function(resolve){
    loadGoogleMaps(async function(){
      try {
        var PlaceClass = google.maps.places && google.maps.places.Place;
        if(!PlaceClass){ resolve(mergeCommunity([])); return; }
        var fields = ["id", "displayName", "location", "formattedAddress", "rating", "userRatingCount", "priceLevel", "types", "photos"];

        if(!q || q.length === 0){
          var resp = await PlaceClass.searchNearby({
            fields: fields,
            locationRestriction: { center: { lat: center.lat, lng: center.lng }, radius: rad },
            includedPrimaryTypes: ["restaurant", "cafe", "bakery", "meal_takeaway", "bar"],
            maxResultCount: 20,
            language: "fr"
          });
          var mapped = (resp && resp.places ? resp.places : []).map(mapNewPlaceToBelly);
          resolve(mergeCommunity(mapped));
        } else {
          var respT = await PlaceClass.searchByText({
            textQuery: q,
            fields: fields,
            locationBias: { center: { lat: center.lat, lng: center.lng }, radius: rad },
            maxResultCount: 20,
            language: "fr"
          });
          var mappedT = (respT && respT.places ? respT.places : []).map(mapNewPlaceToBelly);
          if(mappedT.length && num(mappedT[0].lat) && num(mappedT[0].lng)){
            S.sc = {lat: mappedT[0].lat, lng: mappedT[0].lng};
            S.mapC = {lat: mappedT[0].lat, lng: mappedT[0].lng};
          }
          resolve(mergeCommunity(mappedT));
        }
      } catch(e){
        resolve(mergeCommunity([]));
      }
    });
  });
}

function fetchGooglePlaceDetails(p){
  if(!p) return;
  var gpId = p.gPlaceId || (p.pid && p.pid.indexOf("gp:") === 0 ? p.pid.slice(3) : null);
  if(!gpId || S.gDetailsCache[gpId]) return;
  S.gDetailsCache[gpId] = {loading: true};
  loadGoogleMaps(async function(){
    try {
      var PlaceClass = google.maps.places && google.maps.places.Place;
      if(!PlaceClass) return;
      var placeObj = new PlaceClass({ id: gpId, requestedLanguage: "fr" });
      await placeObj.fetchFields({
        fields: ["rating", "userRatingCount", "reviews", "googleMapsURI", "formattedAddress", "photos"]
      });
      var gPhoto = (placeObj.photos && placeObj.photos.length && placeObj.photos[0].getURI) ? placeObj.photos[0].getURI({maxWidth: 900}) : "";
      var revs = (placeObj.reviews || []).slice(0, 5).map(function(rv){
        return {
          author_name: (rv.authorAttribution && rv.authorAttribution.displayName) || "Utilisateur Google",
          relative_time_description: rv.relativePublishTimeDescription || "",
          rating: rv.rating || 0,
          text: rv.text || ""
        };
      });
      S.gDetailsCache[gpId] = {
        photo: gPhoto,
        loading: false,
        rating: placeObj.rating || null,
        total: placeObj.userRatingCount || 0,
        reviews: revs,
        url: placeObj.googleMapsURI || ""
      };
      if(S.sel && keyOf(S.sel) === keyOf(p)){
        if(placeObj.formattedAddress && !S.sel.a) S.sel.a = placeObj.formattedAddress;
        render();
      }
    } catch(e){
      S.gDetailsCache[gpId] = {loading: false, error: true};
    }
  });
}

function applyFilt(arr){
  var f=S.filt;
  var a=(arr||[]).filter(function(p){
    var c=p.cat||getRestoCat(p.n,p.type,p.priceLunch,p.cuisine);
    var cui=p.cuisine||"";
    var matchCat = !f.cats.length || f.cats.indexOf(c)>-1;
    var matchCui = !f.cuisine.length || f.cuisine.some(function(ck){ return cui.toLowerCase().indexOf(ck)>-1 || c===ck; });
    if(f.cats.length && f.cuisine.length) return matchCat && matchCui;
    return matchCat || matchCui;
  });
  sortP(a);
  a.forEach(function(p){p.dc=(S.sc&&num(p.lat)&&num(p.lng))?dist(S.sc.lat,S.sc.lng,p.lat,p.lng):null});
  return a;
}

function fitResults(){
  if(!S.map || S.tab !== "map" || !window.google) return;
  try {
    var pts = (S.sr||[]).filter(function(p){return num(p.lat)&&num(p.lng)}).slice(0,12);
    if(pts.length > 1){
      var bounds = new google.maps.LatLngBounds();
      pts.forEach(function(p){ bounds.extend({lat: p.lat, lng: p.lng}); });
      S.map.fitBounds(bounds, 36);
      return;
    }
    if(pts.length === 1){
      S.map.setCenter({lat: pts[0].lat, lng: pts[0].lng});
      S.map.setZoom(16);
      return;
    }
    if(S.mapC){
      S.map.setCenter({lat: S.mapC.lat, lng: S.mapC.lng});
      S.map.setZoom(15);
    }
  } catch(e){}

  var cat=p.cat||(g&&g.cat)||"trad_low";

    '<div class="pg-top">'+
      '<button class="pg-ic" onclick="S.sel=null;render()">'+pgi("back")+'</button>'+
      '<div class="pg-acts">'+
        '<button class="pg-ic heart '+(liked?"on":"")+'" onclick="togL()">'+pgi("heart")+'</button>'+
        '<button class="pg-ic '+(wished?"on":"")+'" onclick="togW()">'+pgi("bookmark")+'</button>'+

      '<div class="pg-score">'+
        (avg!=null
          ?'<span class="pg-big">'+avg.toFixed(1).replace(".",",")+'</span><span class="stars">'+stars(avg)+'</span><span class="pg-cnt">'+g.c+' avis</span>'
          :'<span class="pg-cnt" style="font-size:14px">Pas encore d’avis Belly</span>')+
      '</div>'+
    '</div>'+
  '</div>';

  var tiles='<div class="pg-tiles">'+
    pgTile(ICONS.dine,'Sur place',g?g.sp:0,g?g.cp:0)+
    pgTile(ICONS.delivery,'Livraison',g?g.sd:0,g?g.cd:0)+
  '</div>';

  var gLine=gRating?'<div class="pg-g">Google · '+String(gRating).replace(".",",")+' ★'+(gTotal?' ('+gTotal+' avis)':'')+'</div>':'';

  var addr='<div class="pg-addr">'+pgi("pin")+
    '<div class="pg-addr-t">'+esc(p.a||"Adresse non renseignée")+(d!=null?'<small>'+fmtD(d)+'</small>':'')+'</div>'+
    (num(p.lat)&&num(p.lng)?'<button class="pg-mini" title="Sur la carte" onclick="S.focus={lat:S.sel.lat,lng:S.sel.lng};S.tab=\'map\';S.sel=null;render()">'+pgi("map")+'</button>':'')+
    '<a class="pg-mini" title="Itinéraire" href="'+externalGoogleMapsUrl(p)+'" target="_blank" rel="noopener">'+pgi("nav")+'</a>'+
  '</div>';

  var revs=g?sortReviewsBy(g.rv.filter(function(x){return S.pf==="all"||(S.pf==="deliv"?x.mode==="deliv":x.mode!=="deliv")}),S.rsort):[];
  var pills=[["all","Tous",""],["place","Sur place",ICONS.dine],["deliv","Livraison",ICONS.delivery]].map(function(t){
    return '<button class="pg-pill '+(S.pf===t[0]?"on":"")+'" onclick="S.pf=\''+t[0]+'\';render()">'+t[2]+t[1]+'</button>';
  }).join("");

  }

  return '<div class="pg">'+hero+tiles+gLine+addr+
    '<div class="pg-h"><h3>Avis'+(g?' ('+g.c+')':'')+'</h3>'+(g?'<div class="pg-seg">'+pills+'</div>':'')+'</div>'+

function initMap(){
  loadGoogleMaps(function(){
    var el = document.getElementById("map");
    if(S.tab !== "map" || !el) return;
    var c = S.focus ? {lat:S.focus.lat, lng:S.focus.lng} : S.loc ? {lat:S.loc.lat, lng:S.loc.lng} : S.home ? {lat:S.home.lat, lng:S.home.lng} : {lat:48.8566, lng:2.3522};
    var z = S.focus ? 16 : S.loc ? 14 : S.home ? 11 : 13;
    var isDark = ls("lr_theme") === "dark";

    S.map = new google.maps.Map(el, {
      center: c,
      zoom: z,
      disableDefaultUI: true,
      zoomControl: true,
      clickableIcons: false,
      styles: isDark ? GMAPS_DARK_STYLE : []
    });
    S.gInfo = new google.maps.InfoWindow();
    S.gMarkers = [];

    if(S.loc){
      var meMarker = new google.maps.Marker({
        position: {lat: S.loc.lat, lng: S.loc.lng},
        map: S.map,
        title: "Toi",
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 8,
          fillColor: "#192A3A",
          fillOpacity: 1,
          strokeColor: "#E5B83F",
          strokeWeight: 2.5
        }
      });
      S.gMarkers.push(meMarker);
    }
    drawMarkers();
  });
}

function expandText(el){

function drawMarkers(){
  if(!S.map || !window.google) return;
  if(S.gMarkers){
    S.gMarkers.forEach(function(m){ if(m.getTitle() !== "Toi") m.setMap(null); });
    S.gMarkers = S.gMarkers.filter(function(m){ return m.getTitle() === "Toi"; });
  }
  S.mk = [];
  var g = gmap(allv()), seen = {};

  Object.keys(g).forEach(function(k){
    var o = g[k];
    if(!num(o.lat) || !num(o.lng)) return;
    seen[k] = 1;
    var i = S.mk.push(o) - 1;
    var col = getRestoColor(o);
    var mk = new google.maps.Marker({
      position: {lat: o.lat, lng: o.lng},
      map: S.map,
      title: o.n,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 9,
        fillColor: col,
        fillOpacity: 0.95,
        strokeColor: "#FFFFFF",
        strokeWeight: 2
      }
    });
    mk.addListener("click", function(){
      if(!S.gInfo) S.gInfo = new google.maps.InfoWindow();
      S.gInfo.setContent('<div style="padding:2px 4px"><b>'+esc(o.n)+'</b><br><span style="color:#E5B83F">'+stars(o.s/o.c)+'</span> '+(o.s/o.c).toFixed(1)+' ('+o.c+')<br><a href="#" onclick="openK('+i+');return false" style="font-weight:700;color:#192A3A">Voir les avis</a></div>');
      S.gInfo.open(S.map, mk);
    });
    S.gMarkers.push(mk);
  });

  var listToDraw = (S.sr || []);
  listToDraw.forEach(function(p){
    if(seen[keyOf(p)] || !num(p.lat) || !num(p.lng)) return;
    var col = getRestoColor(p);
    var mk = new google.maps.Marker({
      position: {lat: p.lat, lng: p.lng},
      map: S.map,
      title: p.n,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 7,
        fillColor: col,
        fillOpacity: 0.78,
        strokeColor: "#FFFFFF",
        strokeWeight: 1.5
      }
    });
    mk.addListener("click", function(){
      if(!S.gInfo) S.gInfo = new google.maps.InfoWindow();
      var gInfoStr = p.gRating ? '<br>Google : '+String(p.gRating).replace(".",",")+'★ ('+p.gCount+')' : '';
      S.gInfo.setContent('<div style="padding:2px 4px"><b>'+esc(p.n)+'</b><br>'+esc(p.a||"")+gInfoStr+'<br><a href="#" onclick="openR(\''+encodeURIComponent(p.pid)+'\');return false" style="font-weight:700;color:#192A3A">Voir la fiche</a></div>');
      S.gInfo.open(S.map, mk);
    });
    S.gMarkers.push(mk);
  });
}

function handlePhoto(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(evt){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var max_size=600;
      var width=img.width, height=img.height;
      if(width>height){if(width>max_size){height*=max_size/width;width=max_size;}}
      else{if(height>max_size){width*=max_size/height;height=max_size;}}
      canvas.width=width; canvas.height=height;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,width,height);
      S.form.photo=canvas.toDataURL('image/jpeg', 0.7);
      render();
    };
    img.src=evt.target.result;
  };
  reader.readAsDataURL(file);
}

function send(){var f=S.form,p=f.place;if(!p||!f.note){alert("Choisis un resto et une note !");return}

var priv=f.vis==="lg",tls=tlsOf();if(priv&&!tls.length){alert("Sélectionne au moins une ligue.");return}
var cleanSt=(f.st||[]).slice(0, MAX_STICKERS);
var r={uid:S.uid,pseudo:S.pseudo,col:S.col||"",pid:p.pid,resto:p.n,addr:p.a||"",note:f.note,cat:f.cat||p.cat||getRestoCat(p.n,p.type,p.priceLunch,p.cuisine),cuisine:p.cuisine||"",avis:(f.avis||"").trim(),photo:f.photo||"",gPhoto:p.gPhoto||"",st:cleanSt,leagues:priv?tls.slice():S.leagues.slice(),mode:f.mode==="deliv"?"deliv":"place",ts:Date.now()};
if(num(p.lat)&&num(p.lng)){r.lat=p.lat;r.lng=p.lng}if(priv)r.pub=false;

var promise;
if(f.editId) {
  var oldCol = f.editLg ? S.fdb.collection("leagues/"+f.editLg+"/reviews") : S.fdb.collection("reviews");
  promise = oldCol.doc(f.editId).delete().then(function(){
    var ps=priv?tls.map(function(c){return S.fdb.collection("leagues/"+c+"/reviews").add(Object.assign({},r))}):[S.fdb.collection("reviews").add(r)];
    return Promise.all(ps);
  });
} else {
  var ps=priv?tls.map(function(c){return S.fdb.collection("leagues/"+c+"/reviews").add(Object.assign({},r))}):[S.fdb.collection("reviews").add(r)];
  promise = Promise.all(ps);
}

promise.then(function(){
  S.form={note:0,st:[],vis:f.vis,mode:f.mode,tls:tls.slice(),cat:"trad_low",cuisine:"",photo:"",editId:null,editLg:null};
  S.sr=null;S.sq="";
  if(S.noteOpen){ S.noteOpen=false; var el=document.getElementById("lb-note-modal"); if(el)el.remove(); }
  if(priv){S.league=tls[0];S.lv="feed";S.lgTab="leagues";S.leagueOpen=true;save();S.tab="league"}else{S.sel=p;S.tab="map"}
  render()
}).catch(function(err){alert("Enregistrement impossible: "+(err.message||""))})}

      };
      out.push(seen[x.uid]);
    });
  });
  return out;
}

function createLeague(){

    return;
  }
  function tryGenerate(attempts){
    if(attempts <= 0){ alert("Impossible de générer un code unique, réessaie."); return; }
    var code = genUniqueLeagueCode();
    var ref = S.fdb.collection("leagues").doc(code);
    ref.get().then(function(doc){
      if(doc.exists){
        tryGenerate(attempts - 1);
        return;
      }
      var payload = {
        code: code,
        name: customName || "",
        createdBy: S.uid,
        createdAt: Date.now()
      };
      ref.set(payload).then(function(){
        if(customName) S.leagueNames[code] = customName;
        pick(code);
        alert("Ligue créée ! Partage le code " + code + " ou le lien d’invitation.");
      }).catch(function(){
        alert("Création impossible pour le moment.");
      });
    }).catch(function(){
      alert("Erreur de connexion.");
    });
  }
  tryGenerate(5);
}

function join(){
  var inp = document.getElementById("lg");
  var raw = inp ? inp.value.trim() : "";
  var l = raw;
  var m = raw.match(/[?&]join=([^&]+)/i);
  if(m && m[1]){
    try { l = decodeURIComponent(m[1]); } catch(e){ l = m[1]; }
  }
  l = l.trim().toUpperCase().replace(/\s+/g,"-").replace(/[\/.]/g,"");
  if(!l){alert("Entre un code de ligue");return}
  if(S.leagues.indexOf(l) > -1){
    pick(l);
    return;
  }
  if(!S.fdb){
    alert("Connexion requise pour vérifier qu'une ligue existe avec ce code.");
    return;
  }
  S.fdb.collection("leagues").doc(l).get().then(function(doc){
    if(doc.exists){
      var d = doc.data() || {};
      if(d.name) S.leagueNames[l] = d.name;
      if(d.coverPhoto) S.leaguePhotos[l] = d.coverPhoto;
      pick(l);
      return;
    }
    return S.fdb.collection("leagues/"+l+"/reviews").limit(1).get().then(function(q){
      if(!q.empty){
        pick(l);
      } else {
        alert("Aucune ligue trouvée avec le code « " + l + " ». Vérifie le code exact ou crée une nouvelle ligue.");
      }
    });
  }).catch(function(){
    alert("Vérification impossible pour le moment.");
  });
}

function handleLeaguePhoto(e){
  var file = e.target.files && e.target.files[0];
  var code = S.photoTargetLeague;
  if(!file || !code) return;
  var reader = new FileReader();
  reader.onload = function(evt){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement("canvas");
      var max_size = 750;
      var w = img.width, h = img.height;
      if(w > h){ if(w > max_size){ h *= max_size / w; w = max_size; } }
      else { if(h > max_size){ w *= max_size / h; h = max_size; } }
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.72);
      saveLeaguePhoto(code, dataUrl);
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

function getRecentSearches(){
  try { return JSON.parse(localStorage.getItem("lr_recent_searches") || "[]"); }
  catch(e){ return []; }
}

function saveRecentSearch(term){
  if(!term) return;
  var t = String(term).trim();
  if(t.length < 2) return;
  var list = getRecentSearches().filter(function(x){ return String(x).toLowerCase() !== t.toLowerCase(); });
  list.unshift(t);
  try { localStorage.setItem("lr_recent_searches", JSON.stringify(list.slice(0, 8))); } catch(e){}
}

function openNoteSheet(){
  S.noteOpen = true;
  S.prevTab = S.tab;
  if(!S.form) S.form = {note:0, avis:"", mode:"place", st:[], vis:"pub", tls:S.league?[S.league]:[], cat:"trad_low", cuisine:""};
  S.form.place = null;
  S.manual = false;
  S.sq = "";
  S.sr = null;
  renderNoteSheet();
  setTimeout(function(){
    var inp = document.getElementById("lb-note-inp");
    if(inp) inp.focus();
  }, 60);
}

function closeNoteSheet(){
  S.noteOpen = false;
  S.manual = false;
  if(S.tab === "add" && S.prevTab && S.prevTab !== "add"){
    S.tab = S.prevTab;
  }
  var el = document.getElementById("lb-note-modal");
  if(el) el.remove();
  render();
}

function onNoteSearchInput(val){
  S.sq = val;
  if(!val || !val.trim()){
    S.sr = null;
    updateNoteSheetBody();
    return;
  }
  S.busy = true;
  updateNoteSheetBody();
  searchPlaces(val.trim()).then(function(r){
    S.sr = applyFilt(r);
    S.busy = false;
    updateNoteSheetBody();
  }).catch(function(){
    S.sr = [];
    S.busy = false;
    updateNoteSheetBody();
  });
}

function onNoteSearchKeydown(e){
  if(e && e.key === "Enter"){
    e.preventDefault();
    if(S.sq && String(S.sq).trim()){
      saveRecentSearch(S.sq);
    }
    var inp = document.getElementById("lb-note-inp");
    if(inp) inp.blur();
  }
}

function pickRecentSearch(term){
  S.sq = term;
  var inp = document.getElementById("lb-note-inp");
  if(inp) inp.value = term;
  onNoteSearchInput(term);
}

function updateNoteSheetBody(){
  var body = document.getElementById("lb-sheet-body");
  var searchBox = document.querySelector(".lb-sheet-search");
  if(!body) return;
  var f = S.form;

  if(f && f.place){
    if(searchBox) searchBox.style.display = "none";
    var h = add();
    body.innerHTML = h.replace("<h2>J’ai mangé où ?</h2>", "");
    return;
  }

  if(S.manual){
    if(searchBox) searchBox.style.display = "none";
    body.innerHTML = '<div class="card strict"><div class="sub">Ajoute ton resto toi-même :</div><input id="mn" placeholder="Nom du restaurant" value="'+esc(S.sq)+'"><input id="ma" placeholder="Adresse"><button class="btn" onclick="manualOk()">Continuer</button><button class="back" onclick="S.manual=false;render()">← Retour</button></div>';
    return;
  }

  if(searchBox) searchBox.style.display = "block";

  if(!S.sq || !String(S.sq).trim()){
    var recents = getRecentSearches();
    var recHtml = recents.length
      ? '<div class="lb-recent-title">Recherches récentes</div>' +
        recents.map(function(r){
          var safe = String(r).replace(/'/g, "\\'");
          return '<div class="lb-recent-row" onclick="pickRecentSearch(\''+safe+'\')"><span>'+esc(r)+'</span></div>';
        }).join("")
      : '<div class="empty">C’est désert ici ! Tape le nom d’un restaurant ci-dessus.</div>';
    body.innerHTML = locCard() + recHtml;
    return;
  }

  body.innerHTML = "<div id='res'>" + resHTML() + "</div>";
}

function renderNoteSheet(){
  var old = document.getElementById("lb-note-modal");
  if(old) old.remove();
  if(!S.noteOpen) return;

  var modal = document.createElement("div");
  modal.id = "lb-note-modal";
  modal.className = "lb-modal";
  modal.innerHTML =
    '<div class="lb-sheet">' +
      '<div class="lb-sheet-hd">' +
        '<button type="button" class="cancel-btn" onclick="closeNoteSheet()">Annuler</button>' +
        '<div class="sheet-title">Noter un resto</div>' +
        '<div style="width:55px"></div>' +
      '</div>' +
      '<div class="lb-sheet-search">' +
        '<input id="lb-note-inp" type="search" placeholder="Nom du restaurant, adresse..." value="'+esc(S.sq||"")+'" oninput="onNoteSearchInput(this.value)" onkeydown="onNoteSearchKeydown(event)">' +
      '</div>' +
      '<div id="lb-sheet-body" class="lb-sheet-body"></div>' +
    '</div>';
  document.body.appendChild(modal);
  updateNoteSheetBody();
}

    rest=a.slice(3);
  }
  return pod+rest.map(function(u,i){
    var p=a.length>=3?i+4:i+1;
    var ulink=(u.uid&&u.uid!==S.uid)?' onclick="openUser(\''+encodeURIComponent(u.uid)+'\',\''+encodeURIComponent(u.pseudo)+'\')" style="cursor:pointer"':'';
    return '<div class="lgx-row"><div class="lgx-rk">'+p+'</div><div class="lgx-av" style="background:'+u.col+'"'+ulink+'>'+lgIni(u.pseudo)+'</div>'+
      '<div class="lgx-meta"'+ulink+'><div class="lgx-nm">'+esc(u.pseudo)+'</div><div class="lgx-sub">Moyenne '+(u.s/u.n).toFixed(1)+'/5</div></div>'+
      '<b>'+u.n+' avis</b></div>';
  }).join("");
}

function lgxTopReviews(list){
  var b=list.filter(function(x){return x.note>=4}).sort(function(x,y){return y.note-x.note||y.ts-x.ts});
  if(!b.length)return '<div class="lgx-empty"><b>Aucun top avis</b><p>Les avis 4 étoiles et plus apparaîtront ici.</p></div>';
  return b.map(lgxRv).join("");
}

function lgxMembersView(c){
  var mem=lgMembers(c),list=lrev(c);
  return mem.map(function(m){
    var cnt=list.filter(function(x){return x.uid===m.uid}).length;
    var isMe=m.uid===S.uid,f=hasFriend(m.uid);
    var ulink=!isMe?' onclick="openUser(\''+encodeURIComponent(m.uid)+'\',\''+encodeURIComponent(m.pseudo)+'\')"':'';
    return '<div class="lgx-row"><div class="lgx-av" style="background:'+m.col+'"'+ulink+'>'+lgIni(m.pseudo)+'</div>'+
      '<div class="lgx-meta"'+ulink+'><div class="lgx-nm">'+esc(m.pseudo)+'</div><div class="lgx-sub">'+cnt+' '+(cnt>1?'avis':'avis')+'</div></div>'+
      (isMe?'<span class="lgx-sub">Moi</span>'
        :'<button class="lgx-btn '+(f?'':'pri')+'" onclick="'+(f?'delFriend(\''+esc(m.uid)+'\')':'addFriend(\''+esc(m.uid)+'\',\''+esc(m.pseudo)+'\')')+'">'+(f?'Suivi':'Suivre')+'</button>')+'</div>';
  }).join("");
}

function lgxDetail(){
  var c=S.league||S.leagues[0],rev=sortReviewsBy(lrev(c),S.lrsort),mem=lgMembers(c);
  var photo=S.leaguePhotos&&S.leaguePhotos[c],ec=esc(c);
  var nf=getLeagueNotif(c);
  var body;
  if(S.lv==="feed")body=rev.length?(reviewSortBar(S.lrsort,"setLeagueRevSort")+rev.map(lgxRv).join("")):'<div class="lgx-empty"><b>Aucun avis dans cette ligue</b><p>Sois le premier à publier une note ici.</p><button class="lgx-cta" onclick="openNoteSheet()">Noter un resto</button></div>';
  else if(S.lv==="rank")body=lgxRank(rev);
  else if(S.lv==="best")body=lgxTopReviews(rev);
  else body=lgxMembersView(c);

  return status()+'<div class="lgx">'+
    '<div class="lgx-bar">'+
      '<button class="lgx-ic" onclick="closeLeagueCard()" title="Retour">'+lgi("back")+'</button>'+
      '<div class="lgx-bar-r">'+
        '<button class="lgx-ic" onclick="lgMenu(\''+ec+'\')" title="Notifications">'+lgi("bell")+(nf.enabled?'<span class="bell-dot" style="width:9px;height:9px;min-width:9px;padding:0;background:#34C759"></span>':'')+'</button>'+
        '<button class="lgx-ic" onclick="share(\''+ec+'\')" title="Inviter">'+lgi("share")+'</button>'+
        '<button class="lgx-ic" onclick="lgMenu(\''+ec+'\')" title="Options">'+lgi("more")+'</button>'+
      '</div>'+
    '</div>'+
    '<div class="lgx-hero '+(photo?'has-photo':'')+'" style="'+lgBg(photo)+'">'+
      '<div class="lgx-hero-top">'+lgStack(mem,5)+'</div>'+
      '<h1>'+esc(leagueLabel(c))+'</h1>'+
      '<div class="lgx-hero-bot">'+
        '<div class="lgx-stats"><div><b>'+mem.length+'</b><span>'+(mem.length>1?'membres':'membre')+'</span></div><div><b>'+rev.length+'</b><span>avis</span></div></div>'+
        '<div class="lgx-hero-bot-r">'+
          '<button class="lgx-code-chip" title="Copier le code" onclick="event.stopPropagation();lgCopy(this,\''+ec+'\')">'+lgi("copy")+'<span>'+ec+'</span></button>'+
          '<button class="lgx-photo-btn" onclick="event.stopPropagation();pickLeaguePhoto(\''+ec+'\')">'+lgi("camera")+'<span>'+(photo?'Photo':'Ajouter photo')+'</span></button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="lgx-switch">'+[["feed","Fil"],["rank","Classement"],["best","Top avis"],["members","Membres"]].map(function(t){
      return '<button class="lgx-pill '+(S.lv===t[0]?"on":"")+'" onclick="S.lv=\''+t[0]+'\';render()">'+t[1]+'</button>';
    }).join("")+'</div>'+
    body+'</div>';
}

/* ---------- Vue 3 : Amis (Fil / Classement / Top avis + Amis / Que je suis / Qui me suit) ---------- */
function lgxFriendRow(uid, pseudo, col){
  var f = hasFriend(uid);
  var fol = isFollower(uid);
  var mut = f && fol;
  var avCol = col || hashColor(String(uid || pseudo || "?"));
  var ulink = ' onclick="openUser(\''+encodeURIComponent(uid)+'\',\''+encodeURIComponent(pseudo)+'\')"';
  var badge = mut
    ? '<span class="status-badge">Ami</span>'
    : (fol ? '<span class="status-badge">Te suit</span>' : '');
  var subTxt = mut
    ? 'Vous vous suivez mutuellement'
    : (fol ? 'Suit ton profil sur Belly' : 'Profil suivi');
  var btnLabel = f ? 'Suivi' : (fol ? 'Suivre en retour' : 'Suivre');
  var btnAct = f
    ? 'delFriend(\''+esc(uid)+'\')'
    : 'addFriend(\''+esc(uid)+'\',\''+esc(pseudo)+'\')';

  return '<div class="lgx-row">'+
    '<div class="lgx-av" style="background:'+avCol+'"'+ulink+'>'+lgIni(pseudo)+'</div>'+
    '<div class="lgx-meta"'+ulink+'><div class="lgx-nm">'+esc(pseudo)+badge+'</div><div class="lgx-sub">'+subTxt+'</div></div>'+
    '<button class="lgx-btn '+(f?'':'pri')+'" onclick="'+btnAct+'">'+btnLabel+'</button>'+
  '</div>';
}

function lgxFriends(){
  var q = S.userSearchQ || "";
  var followingList = (S.friends || []).filter(function(f){ return f && f.uid && !isB(f.uid); });
  var followersList = (S.followers || []).filter(function(f){ return f && f.uid && !isB(f.uid); });
  var mutualList = followingList.filter(function(f){ return isFollower(f.uid); });
  var sugg = leagueSuggestions();
  var unreadCount = followersList.filter(function(f){
    return !hasFriend(f.uid) && (S.ignoredFollows || []).indexOf(f.uid) < 0;
  }).length;

  var bellBtn = '<button class="lgx-ic" onclick="openFollowNotifs()" title="Notifications d’abonnés">' +
    lgi("bell") +
    (unreadCount ? '<span class="bell-dot">'+(unreadCount>9?'9+':unreadCount)+'</span>' : '') +
  '</button>';

  var h = status() + '<div class="lgx">' +
    lgxTop("Amis", mutualList.length + (mutualList.length>1?" amis · ":" ami · ") + followingList.length + " suivis · " + followersList.length + " abonnés", bellBtn) +
    lgxSwitch();

  // Barre de recherche de personnes par pseudo
  h += '<div class="lgx-search">' +
    lgi("search") +
    '<input class="lgx-in" id="friend-sq" placeholder="Rechercher un pseudo…" value="'+esc(q)+'" oninput="S.userSearchQ=this.value" onkeydown="if(event.key===\'Enter\')searchUsersByPseudo()">' +
    (q ? '<button class="lgx-x" onclick="S.userSearchQ=\'\';S.userSearchRes=null;render()">'+lgi("x")+'</button>' : '') +
    '<button class="lgx-btn pri" style="padding:7px 12px;font-size:13px" onclick="searchUsersByPseudo()">OK</button>' +
  '</div>';

  if(S.userSearchBusy){
    h += '<div class="lgx-empty"><b>Recherche en cours…</b></div>';
  } else if(q && S.userSearchRes !== null){
    h += '<div class="lgx-h2">Résultats pour « '+esc(q)+' »</div>';
    if(!S.userSearchRes.length){
      h += '<div class="lgx-empty"><b>Aucun utilisateur trouvé</b><p>Vérifie l’orthographe du pseudo recherché.</p></div>';
    } else {
      h += S.userSearchRes.map(function(u){
        return lgxFriendRow(u.uid, u.pseudo, hashColor(String(u.uid||u.pseudo)));
      }).join("");
    }
  }

  // Pilules façon Ligue : Amis / Que je suis / Qui me suit
  var fv = S.fv || "friends";
  h += '<div class="lgx-switch">' +
    '<button class="lgx-pill '+(fv==="friends"?"on":"")+'" onclick="S.fv=\'friends\';render()">Amis ('+mutualList.length+')</button>' +
    '<button class="lgx-pill '+(fv==="following"?"on":"")+'" onclick="S.fv=\'following\';render()">Que je suis ('+followingList.length+')</button>' +
    '<button class="lgx-pill '+(fv==="followers"?"on":"")+'" onclick="S.fv=\'followers\';render()">Qui me suit ('+followersList.length+')</button>' +
  '</div>';

  // Avis partagés avec les amis / personnes suivies pour Fil & Top avis
  var circleIds = {};
  followingList.forEach(function(f){ circleIds[f.uid] = 1; });
  followersList.forEach(function(f){ circleIds[f.uid] = 1; });

  var circleReviews = allv().filter(function(x){
    return x.uid && x.uid !== S.uid && circleIds[x.uid];
  }).sort(function(a,b){ return b.ts - a.ts; });

  if(fv === "friends"){
    if(!mutualList.length){
      h += '<div class="lgx-empty"><b>Aucun ami pour l’instant</b><p>Quand toi et une autre personne vous suivez mutuellement, vous apparaissez ici comme amis.</p></div>';
    } else {
      h += mutualList.map(function(f){
        return lgxFriendRow(f.uid, f.pseudo, hashColor(String(f.uid||f.pseudo)));
      }).join("");
    }

    var mutualIds = {};
    mutualList.forEach(function(f){ mutualIds[f.uid] = 1; });
    var friendsFeed = allv().filter(function(x){
      return x.uid && x.uid !== S.uid && mutualIds[x.uid];
    }).sort(function(a,b){ return b.ts - a.ts; });

    h += '<div class="lgx-h2">Fil de tes amis</div>';
    h += friendsFeed.length
      ? friendsFeed.map(lgxRv).join("")
      : '<div class="lgx-empty"><b>Fil vide</b><p>Les derniers avis de tes amis apparaîtront ici.</p></div>';

    var friendsTop = friendsFeed.filter(function(x){ return x.note >= 4; }).sort(function(a,b){ return b.note - a.note || b.ts - a.ts; });
    h += '<div class="lgx-h2">Top avis de tes amis</div>';
    h += friendsTop.length
      ? friendsTop.map(lgxRv).join("")
      : '<div class="lgx-empty"><b>Aucun top avis</b><p>Les notes 4★ et plus de tes amis s’afficheront ici.</p></div>';
  } else if(fv === "following"){
    if(!followingList.length){
      h += '<div class="lgx-empty"><b>Tu ne suis personne pour l’instant</b><p>Recherche un pseudo ci-dessus ou suis les membres de tes ligues.</p></div>';
    } else {
      h += followingList.map(function(f){
        return lgxFriendRow(f.uid, f.pseudo, hashColor(String(f.uid||f.pseudo)));
      }).join("");
    }

    var followingReviews = allv().filter(function(x){
      return x.uid && x.uid !== S.uid && followingList.some(function(f){ return f.uid === x.uid; });
    }).sort(function(a,b){ return b.ts - a.ts; });

    h += '<div class="lgx-h2">Avis des personnes que je suis</div>';
    h += followingReviews.length
      ? followingReviews.map(lgxRv).join("")
      : '<div class="lgx-empty"><b>Aucun avis récent</b><p>Les personnes que tu suis n’ont pas encore publié d’avis.</p></div>';
  } else if(fv === "followers"){
    if(!followersList.length){
      h += '<div class="lgx-empty"><b>Aucun abonné pour l’instant</b><p>Les personnes qui suivent ton profil apparaîtront ici.</p></div>';
    } else {
      h += followersList.map(function(f){
        return lgxFriendRow(f.uid, f.pseudo, hashColor(String(f.uid||f.pseudo)));
      }).join("");
    }
  }

  if(sugg.length){
    h += '<div class="lgx-h2">Dans tes ligues</div><div class="lgx-hs">'+sugg.map(function(u){
      var f=hasFriend(u.uid);
      var ulink=' onclick="openUser(\''+encodeURIComponent(u.uid)+'\',\''+encodeURIComponent(u.pseudo)+'\')" style="cursor:pointer"';
      return '<div class="lgx-sg"><div class="lgx-av" style="background:'+u.col+'"'+ulink+'>'+lgIni(u.pseudo)+'</div>'+
        '<div class="lgx-nm"'+ulink+'>'+esc(u.pseudo)+'</div>'+
        '<div class="lgx-sub">'+esc(u.leagues.join(", "))+'</div>'+
        '<button class="lgx-btn '+(f?'':'pri')+'" onclick="'+(f?'delFriend(\''+esc(u.uid)+'\')':'addFriend(\''+esc(u.uid)+'\',\''+esc(u.pseudo)+'\')')+'">'+(f?'Suivi':'Suivre')+'</button></div>';
    }).join("")+'</div>';
  }

  return h+'</div>';
}

function league(){
  if(S.lgTab==="friends")return lgxFriends();
  if(!S.leagues.length)return lgxList();
  if(!S.leagueOpen)return lgxList();
  if(S.leagues.indexOf(S.league)<0)S.league=S.leagues[0];
  return lgxDetail();
}
</script>
<script>
/* ===== Refonte Profil ===== */
var PFI={
back:'<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'};
function pfi(k){return '<svg class="pf-svg" viewBox="0 0 24 24">'+PFI[k]+'</svg>'}
function pfIni(s){return esc((s||"?").charAt(0).toUpperCase())}
function pfBg(p){
  var gpId = p.gPlaceId || (p.pid && p.pid.indexOf("gp:") === 0 ? p.pid.slice(3) : null);
  var gDet = gpId ? S.gDetailsCache[gpId] : null;
  var gGrp = gmap(allv())[keyOf(p)];
  var myLastPhoto = "";
  if(gGrp && gGrp.rv){
    var mineWithPhoto = gGrp.rv
      .filter(function(r){ return r.uid === S.uid && r.photo; })
      .sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
    if(mineWithPhoto.length) myLastPhoto = mineWithPhoto[0].photo;
  }
  var restoPhoto = (gDet && gDet.photo) || p.gPhoto || (gGrp && gGrp.gPhoto) || "";
  var photo = myLastPhoto || restoPhoto || p.photo || "";
  if(!photo && gpId && !S.gDetailsCache[gpId]){
    fetchGooglePlaceDetails(p);
  }
  if(photo){
    return 'background:linear-gradient(180deg,rgba(0,0,0,.05) 35%,rgba(12,16,22,.85)),url('+photo+') center/cover';
  }
  var c = getRestoColor(p);
  return 'background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(12,16,22,.6)),linear-gradient(135deg,'+c+','+mixHex(c,"#192A3A",.6)+')';
}
function pfSimple(o){
  var myLast = (o.rv || [])
    .filter(function(r){ return r.uid === S.uid && r.photo; })
    .sort(function(a,b){ return (b.ts||0) - (a.ts||0); })[0];
  return {
    pid: o.pid,
    gPlaceId: o.gPlaceId || null,
    n: o.n,
    a: o.a,
    lat: o.lat,
    lng: o.lng,
    cat: o.cat,
    gPhoto: o.gPhoto || "",
    photo: myLast ? myLast.photo : ""
  };
}

/* ---------- Briques ---------- */
function pfStat(n,label,act){return '<button class="pf-st" onclick="'+act+'"><b>'+n+'</b><span>'+label+'</span></button>'}
function pfSwitch(c){
  return '<div class="pf-seg">'+[["prof","Profil"],["agenda","Agenda"],["wish","À tester"]].map(function(t){
    return '<button class="'+(c.pt===t[0]?"on":"")+'" onclick="'+c.setPt(t[0])+'">'+t[1]+'</button>'}).join("")+'</div>';
}
var PFC=["#E5B83F","#C9CED6","#D9915A","#8FB8E8","#8FD1A8"],PFH=[150,120,100];
function pfPod(i,arr,edit){
  var p=(arr||[])[i],act=edit?' onclick="pickTop('+i+')"':'';
  return '<div class="pf-pc" style="height:'+PFH[i]+'px;background:'+PFC[i]+'"'+act+'><span class="n">'+(i+1)+'</span><div class="t">'+(p?esc(p.n):(edit?'+':'–'))+'</div></div>';
}
function pfRow(i,arr,edit){
  var p=(arr||[])[i],act=edit?' onclick="pickTop('+i+')"':'';
  return '<div class="pf-cr" style="background:'+PFC[i]+'"'+act+'><span class="n">'+(i+1)+'</span><span class="t">'+(p?esc(p.n):(edit?'+ Choisir':'–'))+'</span></div>';
}
function pfTop(arr,edit,title){
  var any=(arr||[]).some(Boolean);
  if(!edit&&!any)return '';
  return '<div class="pf-h2">'+title+'</div><div class="pf-pod">'+pfPod(1,arr,edit)+pfPod(0,arr,edit)+pfPod(2,arr,edit)+'</div><div class="pf-rows">'+pfRow(3,arr,edit)+pfRow(4,arr,edit)+'</div>';
}
function pfIdCard(c,name,col,bio,extra){
  return '<div class="pf-idc"><div class="pf-av" style="background:'+col+(c.own?'':';cursor:default')+'"'+(c.own?' onclick="newCol()"':'')+'>'+pfIni(name)+(c.own?'<span class="e">'+pfi("pencil")+'</span>':'')+'</div>'+
    '<div class="pf-bio">'+(bio?esc(bio):'<span style="opacity:.55">Pas de bio.</span>')+'</div>'+extra+'</div>';
}
function pfRv(x,own){
  var idx=ri(x),d=new Date(x.ts);
  var menu=(own&&x._id)?'<button class="pf-more" onclick="pfRvMenu('+idx+')">'+pfi("more")+'</button>':'';
  return '<div class="pf-rv"><div class="pf-rv-top"><span class="d">'+d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+(x.mode==="deliv"?' · Livraison':' · Sur place')+'</span>'+menu+'</div>'+
    '<div class="pf-rv-body" onclick="openReviewDetail('+idx+')"><div class="pf-rv-main">'+
      '<div class="pf-rv-resto">'+esc(x.resto)+dot(x)+'</div><span class="stars">'+stars(x.note)+'</span>'+
      '<div class="pf-rv-txt">'+(x.avis?esc(x.avis):'<i style="opacity:.55">Sans commentaire</i>')+'</div>'+
      ((x.st&&x.st.length)?'<div class="pf-tags">'+x.st.slice(0,MAX_STICKERS).map(function(t){return '<span>'+esc(t)+'</span>'}).join("")+'</div>':'')+
    '</div>'+(x.photo?'<img class="pf-rv-img" src="'+x.photo+'">':'')+'</div></div>';
}
function pfRvMenu(i){
  var x=S.rvl[i];if(!x)return;
  document.getElementById("sheet").innerHTML='<div class="ov" onclick="closeSheet()"><div class="ovb" onclick="event.stopPropagation()">'+
    '<button class="pf-opt" onclick="closeSheet();editReview('+i+')">'+pfi("pencil")+' Modifier</button>'+
    '<button class="pf-opt red" onclick="closeSheet();del('+i+')">'+pfi("trash")+' Supprimer</button>'+
    '<button class="back" onclick="closeSheet()">Annuler</button></div></div>';
}
function pfAgenda(mine,emptyMsg,own){
  if(!mine.length)return '<div class="pf-empty" style="margin-top:16px"><b>'+emptyMsg+'</b>'+(own?'<p>Chaque resto noté apparaît ici, mois par mois.</p><button onclick="openNoteSheet()">Noter un resto</button>':'')+'</div>';
  var h="",cur="";
  mine.forEach(function(x){
    var d=new Date(x.ts),mo=d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
    if(mo!==cur){cur=mo;h+='<div class="pf-month">'+esc(mo)+'</div>'}
    var note=typeof x.note==="number"?String(x.note).replace(".",",")+"/5":"";
    h+='<div class="pf-ag" onclick="openO('+hp(pl(x))+')"><div class="dt"><b>'+d.getDate()+'</b><span>'+esc(d.toLocaleDateString("fr-FR",{month:"short"}))+'</span></div>'+
      '<div class="tx"><div class="pf-nm"><span class="t">'+esc(x.resto)+'</span>'+dot(x)+'</div>'+
      '<div class="pf-sub">'+(x.mode==="deliv"?'Livraison':'Sur place')+(x.addr?' · '+esc(x.addr):'')+'</div>'+
      '<div style="margin-top:4px"><span class="stars">'+stars(x.note)+'</span> <b style="font-size:13px">'+note+'</b></div>'+
      ((x.st&&x.st.length)?'<div class="pf-tags">'+x.st.slice(0,MAX_STICKERS).map(function(t){return '<span>'+esc(t)+'</span>'}).join("")+'</div>':'')+
    '</div></div>';
  });
  return h;
}
function pfGrid(list,emptyMsg,own){
  if(!list.length)return '<div class="pf-empty" style="margin-top:16px"><b>'+emptyMsg+'</b>'+(own?'<p>Garde ici les restos que tu veux essayer.</p><button onclick="go(\'map\')">Explorer la carte</button>':'')+'</div>';
  return '<div class="pf-grid" style="margin-top:14px">'+list.map(function(p){
    return '<div class="pf-gc" style="'+pfBg(p)+'" onclick="openO('+hp(p)+')">'+esc(p.n)+'</div>';
  }).join("")+'</div>';
}
function pfPerson(p,sub){
  var uid=p.uid,pseudo=p.pseudo||"Utilisateur",isMe=uid===S.uid;
  var following=!isMe&&hasFriend(uid),followsMe=!isMe&&isFollower(uid),mutual=following&&followsMe;
  var col=p.col||hashColor(String(uid||pseudo));
  var open='openUser(\''+encodeURIComponent(uid)+'\',\''+encodeURIComponent(pseudo)+'\')';
  var btn="";
  if(!isMe)btn=following
    ?'<button class="pf-btn" onclick="event.stopPropagation();delFriend(\''+esc(uid)+'\')">'+(mutual?'Ami ✓':'Suivi')+'</button>'
    :'<button class="pf-btn pri" onclick="event.stopPropagation();addFriend(\''+esc(uid)+'\',\''+esc(pseudo)+'\')">'+(followsMe?'Suivre en retour':'Suivre')+'</button>';
  return '<div class="pf-row"><div class="pf-pav" style="background:'+col+'" onclick="'+open+'">'+pfIni(pseudo)+'</div><div class="pf-meta click" style="cursor:pointer" onclick="'+open+'"><div class="pf-nm"><span class="t">'+esc(pseudo)+(isMe?' (moi)':'')+'</span></div><div class="pf-sub">'+esc(sub||(mutual?"Ami · suivi réciproque":(followsMe?"Te suit":"Suivi")))+'</div></div>'+btn+'</div>';
}

/* ---------- Corps commun (profil perso et profil d'un ami) ---------- */
function pfSub(c){
  var title=c.sub==="likes"?"Likes":c.sub==="friends"?"Amis & suivis":"Restos";
  var cnt=c.sub==="likes"?c.likes.length:c.sub==="friends"?c.friends.length:c.mr.length;
  var h='<div class="pf"><div class="pf-bar"><button class="pf-ic" onclick="'+c.clearSub+'">'+pfi("back")+'</button><h1>'+title+' <small>'+cnt+'</small></h1></div>';
  if(c.sub==="friends"){
    h+=c.friends.length?c.friends.map(function(f){return pfPerson(f,c.own?(isFollower(f.uid)?"Ami · suivi réciproque":"En attente de suivi en retour"):"")}).join(""):'<div class="pf-empty"><b>Aucun ami pour l’instant</b></div>';
  } else if(c.sub==="likes"){
    h+=pfGrid(c.likes,"Aucun like pour l’instant",false);
  } else {
    h+=pfGrid(c.mr.map(pfSimple),"Aucun resto noté pour l’instant",false);
  }
  return h+'</div>';
}
function pfTabs(c){
  var h=pfSwitch(c);
  if(c.pt==="agenda")return h+pfAgenda(c.mine,c.own?"Ton agenda est vide":"Son agenda est vide",c.own);
  if(c.pt==="wish")return h+pfGrid(c.wish,c.own?"Ta liste est vide":"Aucun resto à tester",c.own);
  h+=c.idcard;
  h+=pfTop(c.top,c.own,c.own?"Mon top 5":"Son top 5");
  h+='<div class="pf-h2">Derniers avis'+(c.mine.length>4?'<button onclick="'+c.setPt("agenda")+'">Tout voir</button>':'')+'</div>';
  h+=c.mine.length?c.mine.slice(0,3).map(function(x){return pfRv(x,c.own)}).join(""):'<div class="pf-empty"><b>'+(c.own?"Tu n’as encore rien noté":"Aucun avis pour l’instant")+'</b>'+(c.own?'<p>Note ton premier resto pour remplir ton profil.</p><button onclick="openNoteSheet()">Noter un resto</button>':'')+'</div>';
  return h+pfLinks(c);
}
function pfLinks(c){
  function row(l,n,act){return '<div class="pf-lr" onclick="'+act+'"><span>'+l+'</span><b>'+n+' ›</b></div>'}
  return '<div class="pf-card pf-links">'+row("Restaurants",c.mr.length,c.setSub("rest"))+row("Likes",c.likes.length,c.setSub("likes"))+row("Amis",c.nfr,c.setSub("friends"))+'</div>';
}
/* ---------- Mon profil ---------- */
function me(){
  if(S.viewUser)return userView(S.viewUser);
  if(S.pt==="set")return pfSettings();
  var mine=allv().filter(function(x){return x.uid===S.uid}).sort(function(a,b){return b.ts-a.ts});
  var mr=groups(mine).sort(function(a,b){return b.s/b.c-a.s/a.c});
  var c={own:true,mine:mine,mr:mr,likes:S.likes,wish:S.wish,friends:S.friends,top:S.top,
    pt:S.pt,sub:S.sub,nfr:S.friends.filter(function(f){return isFollower(f.uid)}).length,
    clearSub:"S.sub=null;render()"};
  c.setPt=function(t){return "S.pt='"+t+"';S.sub=null;render()"};
  c.setSub=function(t){return "S.sub='"+t+"';render()"};
  if(c.sub)return pfSub(c);
  c.idcard=pfIdCard(c,S.pseudo,S.col||"#E5B83F",S.bio,'<button class="pf-edit" onclick="editBio()">'+pfi("pencil")+' Modifier</button>');
  return '<div class="pf"><div class="pf-top"><button class="pf-ic" onclick="S.pt=\'set\';render()">'+pfi("sliders")+'</button><h1>'+esc(S.pseudo||"Profil")+'</h1><span class="sp"></span></div>'+pfTabs(c)+'</div>';
}

/* ---------- Profil d'un autre utilisateur ---------- */
function userView(u){
  var prof=S.viewProf||{},name=prof.pseudo||u.pseudo||"Utilisateur";
  var mine=allv().filter(function(x){return x.uid===u.uid}).sort(function(a,b){return b.ts-a.ts});
  var mr=groups(mine).sort(function(a,b){return b.s/b.c-a.s/a.c});
  var col=prof.col||(mine.length&&mine[0].col)||hashColor(String(u.uid||name));
  var bio=prof.bio||"",top=prof.top||[null,null,null,null,null];
  var isF=hasFriend(u.uid),isM=isMutualFriend(u.uid),followsMe=isFollower(u.uid);
  var back='S.viewUser=null;S.viewProf=null;S.viewPt=\'prof\';S.viewSub=null;render()';
  var c={own:false,mine:mine,mr:mr,top:top,
    likes:Array.isArray(prof.likes)?prof.likes:[],wish:Array.isArray(prof.wish)?prof.wish:[],friends:Array.isArray(prof.friends)?prof.friends:[],
    pt:S.viewPt||"prof",sub:S.viewSub||null,clearSub:"S.viewSub=null;render()"};
  c.setPt=function(t){return "S.viewPt='"+t+"';S.viewSub=null;render()"};
  c.setSub=function(t){return "S.viewSub='"+t+"';render()"};
  c.nfr=c.friends.length;
  if(isM&&c.sub)return pfSub(c);
  var follow=isF
    ?'<button class="pf-follow on" onclick="delFriend(\''+esc(u.uid)+'\')">'+(isM?'Ami ✓ · Ne plus suivre':'Suivi ✓ · Ne plus suivre')+'</button>'
    :'<button class="pf-follow" onclick="addFriend(\''+esc(u.uid)+'\',\''+esc(name)+'\')">'+(followsMe?'Suivre en retour':'Suivre')+'</button>';
  c.idcard=pfIdCard(c,name,col,bio,follow);
  var head='<div class="pf-top"><button class="pf-ic" onclick="'+back+'">'+pfi("back")+'</button><h1>'+esc(name)+'</h1><span class="sp"></span></div>';
  if(isM)return '<div class="pf">'+head+pfTabs(c)+'</div>';
  return '<div class="pf">'+head+c.idcard+pfTop(top,false,"Top 5")+
    '<div class="pf-card pf-links" style="margin-top:18px"><div class="pf-lr" style="cursor:default"><span>Restaurants notés</span><b>'+mr.length+'</b></div></div>'+
    '<div class="pf-hint">Suivez-vous mutuellement pour voir son agenda, ses likes et ses restos à tester.</div></div>';
}

/* ---------- Réglages ---------- */
function pfSettings(){
  var acc=S.user&&!S.user.isAnonymous,dark=ls("lr_theme")==="dark";
  var h='<div class="pf pf-set-page"><div class="pf-bar"><button class="pf-ic" onclick="S.pt=\'prof\';render()">'+pfi("back")+'</button><h1>Réglages</h1></div>';
  h+='<div class="pf-h2" style="margin-top:6px">Apparence</div><div class="pf-card"><div class="pf-set"><span class="l">Mode sombre</span><button class="pf-toggle '+(dark?"on":"")+'" onclick="toggleTheme()"><i></i></button></div></div>';
  h+='<div class="pf-h2">Pseudo</div><div class="pf-card"><div class="pf-set col"><input class="pf-in" id="ps" placeholder="Ton pseudo unique" value="'+esc(S.pseudo)+'"><button class="pf-btn pri" onclick="setP()">Enregistrer</button></div></div>';
  h+='<div class="pf-h2">Ma zone</div><div class="pf-card"><div class="pf-set col"><input class="pf-in" id="dp" placeholder="Département ou ville" value="'+esc(S.dept)+'"><button class="pf-btn pri" onclick="setHome()">Enregistrer</button></div>'+
    '<div class="pf-set"><span class="l">Position</span>'+(S.loc?'<span class="s">Activée ✓</span>':'<button class="pf-btn" onclick="getLoc()">Activer</button>')+'</div></div>';
  h+='<div class="pf-h2">Compte</div><div class="pf-card">';
  if(acc){
    h+='<div class="pf-set"><span class="l">E-mail</span><span class="s">'+esc(S.user.email||"")+'</span></div>'+
       '<div class="pf-set"><button class="link" onclick="logout()">Se déconnecter</button></div>'+
       '<div class="pf-set"><button class="link red" onclick="delAcc()">Supprimer mon compte</button></div>';
  } else {
    h+='<div class="pf-set"><button class="link" onclick="S.guest=false;render()">Se connecter / S’inscrire</button></div>';
  }
  h+='</div>';
  if(S.blocked.length){
    h+='<div class="pf-h2">Bloqués</div>'+S.blocked.map(function(b,k){
      return '<div class="pf-row"><div class="pf-meta"><div class="pf-nm"><span class="t">'+esc(b.n)+'</span></div></div><button class="pf-btn" onclick="unblk('+k+')">Débloquer</button></div>';
    }).join("");
  }
  return h+'</div>';
}
</script>
</body>

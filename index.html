function togW(){tgl(S.wish,S.sel)}
function hp(p){return S.hl.push(p)-1}
function pc(p,meta,bg,big){return '<div class="pc" onclick="openO('+hp(p)+')"><div class="pt" style="'+(bg?'background:'+bg:tl(p.n))+'"><b>'+(big||ini(p.n))+'</b><small>'+esc(p.n)+'</small></div><div class="pm">'+meta+'</div></div>'}
function hs(a,empty){return a.length?'<div class="hs">'+a.join("")+'</div>':'<div class="sub">'+empty+'</div>'}
function grid(l){return '<div class="gr">'+l.map(function(p){return '<div onclick="openO('+hp(p)+')"><div class="pt" style="'+tl(p.n)+'"><b>'+ini(p.n)+'</b><small>'+esc(p.n)+'</small></div></div>'}).join("")+'</div>'}
function home(){var all=allv(),now=Date.now(),mo=new Date(),m=mo.getMonth(),y=mo.getFullYear();
var pop=groups(all.filter(function(x){return now-x.ts<30*864e5})).sort(function(a,b){return b.c-a.c||b.s/b.c-a.s/a.c}).slice(0,12);
var fr=[],seen={};S.leagues.forEach(function(c){lrev(c).forEach(function(x){var k=(x._p?x._lg+"_":"p_")+x._id;if(x.uid!==S.uid&&!seen[k]){seen[k]=1;fr.push(x)}})});
fr.sort(function(a,b){return b.ts-a.ts});fr=fr.slice(0,12);
var best=groups(all.filter(function(x){var d=new Date(x.ts);return d.getMonth()===m&&d.getFullYear()===y})).sort(function(a,b){return b.s/b.c-a.s/a.c||b.c-a.c}).slice(0,12);
return status()+'<div class="big">Resto du moment</div>'
+'<div class="sh">Restos populaires</div>'+hs(pop.map(function(o){return pc(o,'<span class="stars">'+stars(o.s/o.c)+'</span>'+o.c+' avis')}),"Pas encore assez d’avis récents.")
+'<div class="sh">Derniers avis de mes amis</div>'+(S.leagues.length?hs(fr.map(function(x){return pc(pl(x),'<b>'+esc(x.pseudo)+'</b><span class="stars">'+stars(x.note)+'</span>',colOf(x),esc((x.pseudo||"?").charAt(0).toUpperCase()))}),"Tes amis n’ont pas encore noté de resto."):'<div class="card"><div class="sub">Rejoins une ligue pour voir les avis de tes amis.</div><button class="btn" onclick="go(\'league\')">Créer ou rejoindre une ligue</button></div>')
+'<div class="sh">Nos recommandations de la semaine</div>'+hs(best.map(function(o){return pc(o,'<span class="stars">'+stars(o.s/o.c)+'</span>'+(o.s/o.c).toFixed(1)+'/5')}),"Les meilleurs restos du mois apparaîtront ici.")}
var PC=["#c99a0c","#8b96a3","#b56a2c","#3b82d6","#2f9e63"],PH=[130,100,80];
function slot(i){var p=S.top[i];if(i<3)return '<div class="pod" style="background:'+PC[i]+';height:'+PH[i]+'px" onclick="pickTop('+i+')"><div class="pn">'+(i+1)+'</div><div class="pl">'+(p?esc(p.n):'＋')+'</div></div>';
return '<div class="pr" style="background:'+PC[i]+'" onclick="pickTop('+i+')"><span class="pn" style="font-size:20px">'+(i+1)+'</span><span>'+(p?esc(p.n):'＋ Choisir un resto')+'</span></div>'}
function pickTop(i){var mr=groups(allv().filter(function(x){return x.uid===S.uid})).sort(function(a,b){return b.s/b.c-a.s/a.c});
S.pkl=mr.map(function(o){return{pid:o.pid,n:o.n,a:o.a,lat:o.lat,lng:o.lng}});
document.getElementById("sheet").innerHTML='<div class="ov" onclick="closeSheet()"><div class="ovb" onclick="event.stopPropagation()" style="max-height:70vh;overflow:auto"><div class="resto" style="margin-bottom:10px">Place n°'+(i+1)+'</div>'+(S.pkl.length?S.pkl.map(function(p,k){return '<button class="btn alt" style="margin-bottom:8px" onclick="setTop('+i+','+k+')">'+esc(p.n)+'</button>'}).join(""):'<div class="sub">Note d’abord quelques restos pour pouvoir les classer.</div>')+(S.top[i]?'<button class="btn alt" style="margin-bottom:8px" onclick="setTop('+i+',-1)">Retirer</button>':'')+'<button class="back" onclick="closeSheet()">Annuler</button></div></div>'}
function setTop(i,k){closeSheet();var t=S.top.slice();while(t.length<5)t.push(null);if(k<0)t[i]=null;else{var p=cp(S.pkl[k]);for(var j=0;j<5;j++)if(t[j]&&keyOf(t[j])===keyOf(p))t[j]=null;t[i]=p}S.top=t;save();render()}
function editBio(){var b=prompt("Ta bio (160 caractères max)",S.bio||"");if(b===null)return;S.bio=b.trim().slice(0,160);save();render()}
function agenda(mine){if(!mine.length)return '<div class="empty">Ton agenda est vide.<br>Chaque avis que tu publies s’y ajoute.</div>';var h="",cur="";
mine.forEach(function(x){var d=new Date(x.ts),mo=d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}).toUpperCase();if(mo!==cur){cur=mo;h+='<div class="mh">'+esc(mo)+'</div>'}
h+='<div class="dr" onclick="openO('+hp(pl(x))+')"><div class="dd">'+d.getDate()+'</div><div class="dt" style="'+tl(x.resto)+'">'+ini(x.resto)+'</div><div class="di"><div class="resto">'+esc(x.resto)+'</div><div class="who">'+(x.mode==="deliv"?"🛵 ":"🍽️ ")+esc(x.addr||"")+'</div><div class="stars">'+stars(x.note)+'</div></div></div>'});return h}
function me(){if(S.pt==="set")return settings();
var mine=allv().filter(function(x){return x.uid===S.uid}).sort(function(a,b){return b.ts-a.ts}),mr=groups(mine).sort(function(a,b){return b.s/b.c-a.s/a.c});
var h='<div class="row" style="margin:6px 0"><button class="gear" onclick="S.pt=\'set\';render()">⚙️</button><div class="resto" style="font-size:22px">'+esc(S.pseudo||"Profil")+'</div><span style="width:34px"></span></div>';
h+='<div class="tabs">'+[["prof","Profil"],["agenda","Agenda"],["wish","À tester"]].map(function(t){return '<button class="'+(S.pt===t[0]?"on":"")+'" onclick="S.pt=\''+t[0]+'\';S.sub=null;render()">'+t[1]+'</button>'}).join("")+'</div>';
if(S.pt==="agenda")return h+agenda(mine);
if(S.pt==="wish")return h+(S.wish.length?grid(S.wish):'<div class="empty">Ta liste est vide.<br>Ouvre la fiche d’un resto et appuie sur 🔖 À tester.</div>');
if(S.sub){var L=S.sub==="likes"?S.likes:mr.map(function(o){return{pid:o.pid,n:o.n,a:o.a,lat:o.lat,lng:o.lng}});return h+'<button class="back" onclick="S.sub=null;render()">← Retour</button><div class="sh">'+(S.sub==="likes"?"Likes":"Restaurants")+' ('+L.length+')</div>'+(L.length?grid(L):'<div class="empty">Rien pour l’instant.</div>')}
h+='<div class="card"><div class="av" style="background:'+(S.col||"#e1ad01")+';color:#ebebeb">'+esc((S.pseudo||"?").charAt(0).toUpperCase())+'</div><div style="text-align:center">'+(S.bio?esc(S.bio):'<span class="sub">Pas encore de bio.</span>')+'</div><button class="back" style="display:block;margin:6px auto 0" onclick="editBio()">✏️ Modifier la bio</button><button class="back" style="display:block;margin:0 auto" onclick="newCol()">🎲 Changer ma couleur</button></div>';
h+='<div class="sh">Mon top 5</div><div class="podium">'+slot(1)+slot(0)+slot(2)+'</div><div class="pod2">'+slot(3)+slot(4)+'</div>';
h+='<div class="sh">Derniers avis</div>'+(mine.length?'<div class="gr">'+mine.slice(0,4).map(function(x){return '<div onclick="openO('+hp(pl(x))+')"><div class="pt" style="'+tl(x.resto)+'"><b>'+ini(x.resto)+'</b><small>'+esc(x.resto)+'</small></div><div class="pm"><span class="stars">'+stars(x.note)+'</span></div></div>'}).join("")+'</div>':'<div class="sub">Tu n’as pas encore noté de resto.</div>');
return h+'<div class="lr" onclick="S.sub=\'rest\';render()" style="margin-top:14px"><span>Restaurants</span><b>'+mr.length+' ›</b></div><div class="lr" onclick="S.sub=\'likes\';render()"><span>Likes</span><b>'+S.likes.length+' ›</b></div>'}
function loadv(){if(S.state==="error")return '<div class="card"><div class="resto">⚠️ Connexion impossible</div><div class="sub" style="margin:6px 0">'+esc(S.errMsg||"")+'</div>'+(location.hostname.indexOf("github.io")<0?'<div class="sub">Tu ouvres peut-être l’appli depuis un aperçu qui bloque les services externes. Ouvre-la depuis son adresse : https://4rb7vpvc8k-collab.github.io/ligue-resto</div>':'')+'<button class="btn" onclick="location.reload()">Réessayer</button></div>';return '<div class="empty">Chargement…</div>'}
function welcome(){var up=S.wm==="up";
return '<div class="card"><div class="seg"><button class="chip '+(!up?"on":"")+'" onclick="S.wm=\'in\';render()">Connexion</button><button class="chip '+(up?"on":"")+'" onclick="S.wm=\'up\';render()">Inscription</button></div>'+(up?'<input id="wps" placeholder="Ton pseudo (ex : Léo)" autocomplete="nickname" value="'+esc(S.pseudo)+'">':'')+'<input id="wem" type="email" placeholder="E-mail" autocomplete="email"><input id="pw" type="password" placeholder="Mot de passe'+(up?" (6 caractères min.)":"")+'" autocomplete="'+(up?"new-password":"current-password")+'"><button class="btn" onclick="wSubmit()">'+(up?"Créer mon compte":"Se connecter")+'</button>'+(up?'':'<button class="back" onclick="resetPw()">Mot de passe oublié ?</button>')+'</div><div style="text-align:center"><button class="back" onclick="S.guest=true;render()">Continuer sans compte</button></div>'+(S.state==="error"?'<div class="sub">⚠️ Connexion au serveur instable'+(S.errMsg?' ('+esc(S.errMsg)+')':'')+'.</div>':'')}
function onb(){return '<h2>Bienvenue '+esc(S.pseudo)+' 👋</h2><div class="card"><div class="sub">📍 Pour te proposer les restos les plus proches de toi :</div>'+(S.loc?'<div class="sub">✅ Position activée</div>':S.locDenied?'<div class="sub">Position refusée. Tu pourras l’activer plus tard dans les réglages de ton téléphone.</div>':'<button class="btn" onclick="getLoc()">Activer ma position</button>')+'<div class="sub" style="margin-top:12px">Ton département ou ta ville (facultatif) : ça centre ta carte au départ.</div><input id="odp" placeholder="Ex : Rhône, Lyon, 69…" value="'+esc(S.dept)+'" oninput="S.dept=this.value"><button class="btn" onclick="onbDone()">Continuer</button><button class="back" onclick="S.dept=\'\';onbDone()">Passer</button></div>'}
function geocode(q,cb){fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=fr&countrycodes=fr&q="+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(a){cb(a&&a[0]?{lat:parseFloat(a[0].lat),lng:parseFloat(a[0].lon)}:null)}).catch(function(){cb(null)})}
function onbDone(){var d=(S.dept||"").trim(),u=S.user;function fin(){if(u)ls("lr_onb_"+u.uid,"1");S.tab="home";save();render()}
if(!d){S.home=null;fin();return}
geocode(d,function(h){if(h)S.home=h;else alert("Je n’ai pas trouvé ce lieu, tu pourras le modifier dans ton profil.");fin()})}
function setHome(){var d=val("dp");S.dept=d;if(!d){S.home=null;save();render();return}geocode(d,function(h){if(h)S.home=h;else alert("Lieu introuvable.");save();render()})}
function wSubmit(){var up=S.wm==="up",e=val("wem"),p=document.getElementById("pw")?document.getElementById("pw").value:"",n=up?val("wps"):"";
if(!e||!p||(up&&!n)){alert(up?"Pseudo, e-mail et mot de passe requis":"E-mail et mot de passe requis");return}
var a=firebase.auth();if(!up){a.signInWithEmailAndPassword(e,p).catch(authErr);return}
var cu=a.currentUser,cr=firebase.auth.EmailAuthProvider.credential(e,p);
(cu&&cu.isAnonymous?cu.linkWithCredential(cr).then(function(r){return r.user}):a.createUserWithEmailAndPassword(e,p).then(function(r){return r.user})).then(function(u){S.user=u;S.uid=u.uid;S.pseudo=n;S.col=newColor();S.profLoaded=true;S.guest=false;save();render()}).catch(authErr)}
function val(i){var e=document.getElementById(i);return e?e.value.trim():""}
function authErr(e){var m={"auth/email-already-in-use":"Cet e-mail a déjà un compte. Utilise « J’ai déjà un compte ».","auth/credential-already-in-use":"Cet e-mail a déjà un compte. Utilise « J’ai déjà un compte ».","auth/weak-password":"Mot de passe trop court (6 caractères minimum).","auth/invalid-email":"Adresse e-mail invalide.","auth/wrong-password":"E-mail ou mot de passe incorrect.","auth/invalid-credential":"E-mail ou mot de passe incorrect.","auth/user-not-found":"Aucun compte avec cet e-mail.","auth/operation-not-allowed":"La connexion par e-mail n’est pas activée dans Firebase.","auth/too-many-requests":"Trop d’essais, réessaie plus tard."};
alert(m[e&&e.code]||"Une erreur est survenue, réessaie.")}
function resetPw(){var e=val("wem");if(!e){alert("Entre ton e-mail d’abord");return}firebase.auth().sendPasswordResetEmail(e).then(function(){alert("E-mail envoyé ✉️ (regarde aussi les spams)")}).catch(authErr)}
function logout(){S.user=null;S.pseudo="";S.leagues=[];S.league="";S.priv={};S.dept="";S.home=null;S.blocked=[];S.likes=[];S.wish=[];S.top=[null,null,null,null,null];S.bio="";S.col=newColor();S.profLoaded=false;S.guest=false;save();firebase.auth().signOut().then(function(){S.tab="me";render()})}
function delAcc(){if(!confirm("Supprimer définitivement ton compte ? Tes avis déjà publiés resteront affichés."))return;var u=firebase.auth().currentUser;
S.fdb.collection("users").doc(u.uid).delete().catch(function(){}).then(function(){return u.delete()}).then(function(){S.user=null;S.pseudo="";S.leagues=[];S.league="";S.priv={};S.dept="";S.home=null;S.blocked=[];S.likes=[];S.wish=[];S.top=[null,null,null,null,null];S.bio="";S.col=newColor();S.profLoaded=false;S.guest=false;save();alert("Compte supprimé.");render()}).catch(function(e){alert(e&&e.code==="auth/requires-recent-login"?"Pour ta sécurité, déconnecte-toi, reconnecte-toi puis réessaie.":"Suppression impossible.")})}
function setP(){var p=document.getElementById("ps").value.trim();if(!p){alert("Il faut un pseudo");return}S.pseudo=p;save();S.pt="prof";S.tab="home";render()}
function allv(){var a=S.all.slice();Object.keys(S.priv).forEach(function(c){a=a.concat(S.priv[c])});return a.filter(vis)}
function lrev(c){return S.all.filter(function(x){return lg(x).indexOf(c)>-1}).concat(S.priv[c]||[]).filter(vis)}
function subL(){if(!S.fdb)return;S.leagues.forEach(function(c){if(S.unsubs[c])return;S.unsubs[c]=S.fdb.collection("leagues/"+c+"/reviews").onSnapshot(function(q){S.priv[c]=q.docs.map(function(d){var x=d.data();x._p=1;x._lg=c;x._id=d.id;return x});refresh()},function(){})})}
function loadScripts(u,i,done){if(i>=u.length){done();return}var s=document.createElement("script");s.src=u[i];s.onload=function(){loadScripts(u,i+1,done)};s.onerror=function(){S.state="error";S.errMsg="chargement de "+u[i].split("/").pop();render()};document.head.appendChild(s)}
var base="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/";
function startDB(){S.fdb=firebase.firestore();S.state="ready";
S.fdb.collection("reviews").orderBy("ts","desc").limit(300).onSnapshot(function(q){S.all=q.docs.map(function(d){var x=d.data();x._id=d.id;return x});S.state="ready";refresh()},function(e){S.state="error";S.errMsg=(e&&(e.code||e.message))||"";render()});S.fdb.collection("flags").onSnapshot(function(q){S.flags={};q.docs.forEach(function(d){S.flags[d.id]=(d.data().by||[]).length});refresh()},function(){});subL()}
function loadProfile(u){S.fdb.collection("users").doc(u.uid).get().then(function(d){var p=d.exists?d.data():{};
if(p.pseudo){S.pseudo=p.pseudo;ls("lr_onb_"+u.uid,"1")}(p.leagues||[]).forEach(function(c){if(S.leagues.indexOf(c)<0)S.leagues.push(c)});
if(!S.league&&S.leagues.length)S.league=S.leagues[0];(p.blocked||[]).forEach(function(b){if(!isB(b.u))S.blocked.push(b)});if(p.likes)S.likes=p.likes;if(p.wish)S.wish=p.wish;if(p.top)S.top=p.top;if(p.bio)S.bio=p.bio;if(p.col)S.col=p.col;if(p.dept)S.dept=p.dept;if(p.home)S.home=p.home;save();subL()}).catch(function(e){S.errMsg=(e&&e.code)||""}).then(function(){S.profLoaded=true;S.authReady=true;S.tab=S.pseudo?"home":"me";render()})}
render();
try{if(navigator.permissions)navigator.permissions.query({name:"geolocation"}).then(function(r){if(r.state==="granted")getLoc()}).catch(function(){})}catch(e){}
loadScripts([base+"firebase-app-compat.min.js",base+"firebase-auth-compat.min.js",base+"firebase-firestore-compat.min.js"],0,function(){
try{firebase.initializeApp(CFG);firebase.auth().onAuthStateChanged(function(u){
if(!u){S.user=null;firebase.auth().signInAnonymously().catch(function(e){S.state="error";S.errMsg=(e&&e.code)||"auth";render()});return}
S.user=u;S.uid=u.uid;if(!S.fdb)startDB();
if(!u.isAnonymous)loadProfile(u);else{S.authReady=true;render()}})}catch(e){S.state="error";S.errMsg=e.message;render()}});
</script>
</body>

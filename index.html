<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belly</title>
<meta name="theme-color" content="#E5B83F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Belly">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="IMG_4287.jpeg">
<link rel="apple-touch-icon" href="IMG_4287.jpeg">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}

/* --- MODE CLAIR (Par défaut) --- */
html,body{margin:0;background:#F4F1E9;color:#192A3A;font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
body{max-width:520px;margin:0 auto;padding:0 14px 90px}
.hd{background:#E5B83F;color:#192A3A;border-radius:0 0 16px 16px;padding:18px 16px 16px;margin:0 -14px 14px}
.hd h1{font-size:24px;margin:0}.hd div{opacity:.9;font-size:13px;margin-top:2px}
h2{font-size:16px;margin:14px 0 8px}
.sub{color:rgba(25,42,58,.62);font-size:13px;margin-bottom:8px}

.card{background:#F4F1E9;border:1px solid rgba(25,42,58,.2);border-radius:6px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card.asym{border-radius:12px 4px 12px 4px}
.card.strict{border-radius:4px}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{font-size:12px;color:rgba(25,42,58,.62)}
.resto{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}.dot-badge{width:10px;height:10px;border-radius:2px;display:inline-block;flex-shrink:0}
.stars{color:#E5B83F;letter-spacing:1px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:rgba(25,42,58,.08);border-radius:4px;padding:5px 10px;font-size:13px;border:1px solid transparent;color:#192A3A;font-family:inherit;cursor:pointer}
button.chip.on{border-color:#E5B83F;background:#E5B83F;color:#192A3A}
input,textarea{width:100%;padding:11px;border-radius:4px;border:1px solid rgba(25,42,58,.2);background:#F4F1E9;color:#192A3A;font:inherit;font-size:16px;margin-bottom:8px}
textarea{min-height:70px;resize:vertical}
.btn{width:100%;background:#E5B83F;color:#192A3A;border:0;border-radius:4px;padding:13px;font-size:16px;font-weight:700;font-family:inherit;margin-top:2px;cursor:pointer}
.btn.alt{background:rgba(25,42,58,.08);color:#192A3A}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#192A3A;border-top:1px solid rgba(25,42,58,.2);padding-bottom:env(safe-area-inset-bottom,0px);max-width:520px;margin:0 auto;z-index:100}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:11px;color:rgba(244,241,233,.65);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#E5B83F;font-weight:700}

.rate{display:flex;gap:4px;justify-content:center;margin:6px 0 12px}
.rate button{font-size:34px;background:none;border:0;opacity:.3;padding:2px}
.rate button.on{opacity:1}
.rank{display:flex;align-items:center;gap:10px}
.pos{font-size:24px;width:36px;text-align:center}
.empty{text-align:center;color:rgba(25,42,58,.62);padding:30px 10px;font-size:14px}
.code{font-size:24px;font-weight:800;letter-spacing:3px;text-align:center;color:#E5B83F;margin:6px 0}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:4px;background:rgba(25,42,58,.08)}
.seg{display:flex;gap:6px;margin:0 0 10px}.seg button{flex:1;border-radius:4px}
.sr{position:sticky;top:0;background:#F4F1E9;padding:6px 0;z-index:5}
.back{background:none;border:0;color:#192A3A;font-size:15px;font-weight:700;padding:6px 0;font-family:inherit;cursor:pointer}
#map{height:38vh;min-height:240px;border-radius:6px;border:1px solid rgba(25,42,58,.2);z-index:1;overflow:hidden}
.dist{color:#192A3A;font-weight:700}
.row2{display:flex;gap:8px;align-items:center}.row2 input{margin:0}.row2 .btn{width:auto;padding:11px 16px;margin:0}
.st{display:inline-block;position:relative;margin-right:1px}.sb{color:rgba(25,42,58,.62);opacity:.35}.sf{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#E5B83F}.rs{font-size:42px;line-height:1;padding:0 2px;cursor:pointer}
.rate{width:max-content;margin:6px auto 4px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.act{display:flex;gap:18px;justify-content:flex-end;margin-top:8px}.act a{color:rgba(25,42,58,.62);font-size:12px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:flex-end}
.ovb{background:#F4F1E9;width:100%;max-width:520px;margin:0 auto;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.av{width:64px;height:64px;border-radius:6px;background:#E5B83F;color:#192A3A;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;cursor:pointer;position:relative}
.av.edit::after{content:'✎';position:absolute;bottom:-5px;right:-5px;background:#192A3A;color:#E5B83F;font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #F4F1E9}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px 6px}.hs::-webkit-scrollbar{display:none}
.pc{flex:0 0 132px;scroll-snap-align:start}
.pt{height:176px;border-radius:6px;color:#F4F1E9;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pt b{font-size:38px;line-height:1;position:absolute;top:10px;left:10px;opacity:.9}
.pt small{font-size:13px;font-weight:700;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.pm{margin-top:6px;font-size:12px;color:rgba(25,42,58,.62)}
.pm .stars{font-size:13px;display:block}
.big{font-size:32px;font-weight:900;margin:14px 0 0}
.sh{margin:18px 0 8px;font-size:20px;font-weight:800}

/* Carrousels */
.cat-scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:4px 14px 10px}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-item{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;cursor:pointer;scroll-snap-align:start}
.cat-circle{width:68px;height:68px;border-radius:50%;overflow:hidden;border:2px solid rgba(25,42,58,.2);box-shadow:0 2px 6px rgba(0,0,0,0.08);background:#ddd}
.cat-circle img{width:100%;height:100%;object-fit:cover}
.cat-name{font-size:12px;font-weight:600;text-align:center;margin-top:5px;color:#192A3A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}

.tabs{display:flex;background:rgba(25,42,58,.08);border-radius:4px;padding:4px;margin:8px 0 12px}
.tabs button{flex:1;border:0;background:none;padding:10px 0;border-radius:4px;font-size:15px;font-weight:700;color:rgba(25,42,58,.62);font-family:inherit;cursor:pointer}
.tabs button.on{background:#E5B83F;color:#192A3A}
.gear{background:none;border:0;font-size:20px;width:34px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.gear svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.podium{display:flex;align-items:flex-end;gap:8px;margin:8px 0}
.pod{flex:1;border-radius:6px 6px 0 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:8px 4px;text-align:center;color:#192A3A;font-weight:700}
.pn{font-size:28px;font-weight:900}
.pl{font-size:12px;line-height:1.15;word-break:break-word}
.pod2{display:flex;flex-direction:column;gap:8px}
.pr{display:flex;align-items:center;gap:10px;border-radius:6px;padding:10px 12px;font-weight:700;color:#192A3A}
.lr{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-top:1px solid rgba(25,42,58,.2);font-size:17px;cursor:pointer}.lr b{color:rgba(25,42,58,.62);font-weight:600}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gr .pt{height:auto;aspect-ratio:2/3;padding:6px}.gr .pt b{font-size:22px;top:6px;left:6px}.gr .pt small{font-size:10px}
.mh{background:rgba(25,42,58,.08);padding:8px 14px;font-size:13px;letter-spacing:.1em;font-weight:700;margin:12px -14px 0}
.dr{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(25,42,58,.2);cursor:pointer}
.dd{width:46px;height:46px;border:1px solid rgba(25,42,58,.2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(25,42,58,.62);flex:0 0 46px}
.dt{width:46px;height:62px;border-radius:4px;color:#F4F1E9;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 46px}
.di{flex:1;min-width:0}
.tri .btn{flex:1;padding:11px 4px;font-size:14px;white-space:nowrap}

/* --- GRANDES CARTES LIGUE & ONGLET AMIS --- */
.lg-big-card{background:#192A3A;color:#F4F1E9;border:1px solid rgba(25,42,58,.25);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.1);cursor:pointer;transition:transform .15s ease}
.lg-big-card:active{transform:scale(.98)}
.lg-big-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lg-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(229,184,63,.18);color:#E5B83F;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.03em}
.lg-big-mid{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lg-emblem{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#F4F1E9;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.lg-title{font-size:19px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;color:#F4F1E9;line-height:1.2;word-break:break-word}
.lg-sub-code{font-size:12px;color:rgba(244,241,233,.68);margin-top:3px}
.lg-big-foot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid rgba(244,241,233,.12);font-size:13px;font-weight:700;color:#E5B83F}

.bell-btn{position:relative;background:rgba(25,42,58,.08);border:1px solid rgba(25,42,58,.15);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#192A3A;flex-shrink:0}
.bell-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bell-dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#DC2626;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #F4F1E9}

.friend-row-card{background:#F4F1E9;border:1px solid rgba(25,42,58,.2);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.friend-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#F4F1E9;flex-shrink:0}
.friend-meta{flex:1;min-width:0;cursor:pointer}
.friend-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend-sub{font-size:12px;color:rgba(25,42,58,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(229,184,63,.22);color:#192A3A;margin-left:6px}

.prof-review-list{display:flex;flex-direction:column;gap:8px}
.prof-review-item{background:#F4F1E9;border:1px solid rgba(25,42,58,.2);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.prof-review-main{flex:1;min-width:0}
.prof-review-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prof-review-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof-review-date{font-size:11px;color:rgba(25,42,58,.62);flex-shrink:0}
.prof-review-stars{font-size:12px;margin:2px 0}
.prof-review-excerpt{font-size:12px;color:rgba(25,42,58,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof-review-thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid rgba(25,42,58,.2)}

.home-review-card { background: #F4F1E9; border: 1px solid rgba(25,42,58,.2); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
.home-review-card:active { transform: scale(0.98); }
.home-review-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.home-review-user { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #192A3A; }
.home-review-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #F4F1E9; flex-shrink: 0; }
.home-review-resto { font-weight: 800; font-size: 17px; color: #192A3A; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.home-review-comment { font-size: 14px; color: rgba(25,42,58,.62); line-height: 1.4; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.home-review-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(25,42,58,.2); font-size: 12px; color: rgba(25,42,58,.62); }

.photo-container{position:relative;display:block;width:100%;margin-top:8px;border-radius:10px;overflow:hidden;background:#f5f2eb;border:1px solid rgba(25,42,58,.2)}
.photo-preview{width:100%;height:220px;object-fit:cover;display:block}
.photo-del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;font-size:14px;z-index:10}
.card.strict { padding: 6px 10px !important; margin-bottom: 6px !important; }
.review-layout { display: flex; gap: 8px; align-items: flex-start; margin-top: 1px; }
.review-text { flex: 1; font-size: 12.5px; line-height: 1.3; word-break: break-word; }
.review-thumb { width: 48px !important; height: 48px !important; min-width: 48px !important; max-width: 48px !important; border-radius: 6px !important; object-fit: cover !important; cursor: pointer !important; flex-shrink: 0 !important; border: 1px solid rgba(25,42,58,.2) !important; display: block !important; }
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:pointer}
.lightbox img{max-width:90%;max-height:90%;border-radius:8px;object-fit:contain}
.review-text-content { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
.card.strict .review-text.expanded .review-text-content { display: block; overflow: visible; }
.letterboxd-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 4px 0; }
.lb-card { background: #F4F1E9; border: 1px solid rgba(25,42,58,.2); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s; }
.lb-card:active { transform: scale(0.98); }
.lb-poster { width: 100%; height: 160px; object-fit: cover; display: block; }
.lb-info { padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.lb-card.text-only { background: #F4F1E9; border: 1px solid rgba(25,42,58,.2); justify-content: center; align-items: center; text-align: center; min-height: 160px; padding: 14px; }
.lb-card.text-only .lb-resto { font-size: 15px; margin-bottom: 6px; }

.resto-main-card {
  position: static;
  background: #192A3A !important; color: #F4F1E9 !important;
  border: 1px solid rgba(255, 255, 255, 0.15) !important;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15) !important;
  border-radius: 14px !important; padding: 16px !important; margin-bottom: 14px !important;
}
.resto-main-card .resto, .resto-main-card .who, .resto-main-card div { color: #F4F1E9 !important; }
.resto-main-card .btn.alt { background: rgba(255, 255, 255, 0.1) !important; color: #F4F1E9 !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; }

.seg { display: flex; gap: 6px; margin: 10px 0 14px 0 !important; position: static !important; transform: none !important; }
.svg-icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; display: inline-block; }

/* --- MODE SOMBRE (Activé via body.dark-mode) --- */
html.dark-mode,
body.dark-mode {
  color-scheme: dark;
  --bg: #12161C;
  --card: #1C232D;
  --tx: #F4F1E9;
  --mut: rgba(244,241,233,.65);
  --ac: #E5B83F;
  --ac2: rgba(229,184,63,.15);
  --bd: rgba(255,255,255,.1);
  --acd: #E5B83F;
  background: #12161C !important;
  background-color: #12161C !important;
  color: #F4F1E9 !important;
  min-height: 100vh !important;
}
body.dark-mode {
  box-shadow: inset 0 0 0 100vmax #12161C !important;
}
body.dark-mode #app,
body.dark-mode #res,
body.dark-mode .sr,
body.dark-mode #map {
  background: #12161C !important;
  background-color: #12161C !important;
  color: #F4F1E9 !important;
}
body.dark-mode .hd{background:#1C232D;color:var(--tx);border-bottom:1px solid var(--bd)}
body.dark-mode .sub{color:var(--mut)}
body.dark-mode .card,
body.dark-mode .card.strict{background:var(--card) !important;border:1px solid var(--bd) !important;box-shadow:0 4px 12px rgba(0,0,0,.3);color:var(--tx) !important}
body.dark-mode .who{color:var(--mut)}
body.dark-mode .stars{color:var(--ac)}
body.dark-mode .chip{background:var(--card);border:1px solid var(--bd);color:var(--tx)}
body.dark-mode button.chip.on{border-color:var(--ac);background:var(--ac);color:#12161C}
body.dark-mode input,body.dark-mode textarea{border:1px solid var(--bd);background:var(--card);color:var(--tx)}
body.dark-mode .btn{background:var(--ac);color:#12161C}
body.dark-mode .btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
body.dark-mode nav{background:#161B22;border-top:1px solid var(--bd)}
body.dark-mode nav button{color:rgba(244,241,233,.5)}
body.dark-mode nav button.on{color:#E5B83F}
body.dark-mode .empty{color:rgba(244,241,233,.72) !important;background:transparent !important}
body.dark-mode .code{color:var(--ac)}
body.dark-mode .tag{background:var(--ac2)}
body.dark-mode .back{color:var(--ac)}
body.dark-mode #map{border:1px solid var(--bd)}
body.dark-mode .dist{color:var(--ac)}
body.dark-mode .sb{color:var(--mut)}
body.dark-mode .sf{color:var(--ac)}
body.dark-mode .act a{color:var(--mut)}
body.dark-mode .ov{background:rgba(0,0,0,.7)}
body.dark-mode .ovb{background:var(--card);border-top:1px solid var(--bd)}
body.dark-mode .av{background:var(--ac);color:#12161C}
body.dark-mode .av.edit::after{background:#12161C;color:#E5B83F;border:2px solid var(--bg)}
body.dark-mode .pt{color:#F4F1E9;box-shadow:0 4px 12px rgba(0,0,0,.4)}
body.dark-mode .pm{color:var(--mut)}
body.dark-mode .cat-circle{border:2px solid var(--bd);box-shadow:0 2px 6px rgba(0,0,0,0.2);background:#222}
body.dark-mode .cat-name{color:var(--tx)}
body.dark-mode .tabs{background:var(--card);border:1px solid var(--bd)}
body.dark-mode .tabs button{color:var(--mut)}
body.dark-mode .tabs button.on{background:var(--ac);color:#12161C}
body.dark-mode .gear{color:var(--tx)}
body.dark-mode .pod{color:#12161C}

function getRestoCat(name,type,priceLunch,cuisineTag){
  var n=(name||"").toLowerCase();
  var c=(cuisineTag||"").toLowerCase();
  
  if(c.includes("ital") || n.includes("pizza") || n.includes("trattoria") || n.includes("pizzeria") || n.includes("pasta") || n.includes("osteria")) return "italian";
  if(c.includes("fran") || n.includes("bistrot français") || n.includes("brasserie")) return "french";
  if(c.includes("jap") || n.includes("sushi") || n.includes("ramen")) return "japanese";
  if(c.includes("asiat") || n.includes("chinois") || n.includes("thaï") || n.includes("wok")) return "asian";
  if(c.includes("orient") || n.includes("couscous") || n.includes("tajine")) return "oriental";
  if(c.includes("indi") || n.includes("curry")) return "indian";
  if(c.includes("veg") || n.includes("veggie") || n.includes("vegan") || n.includes("végétarien")) return "veggie";
  if(c.includes("mexic") || n.includes("tacos") || n.includes("burrito")) return "mexican";
  if(c.includes("mer") || c.includes("seafood") || n.includes("huître") || n.includes("huitre") || n.includes("poisson") || n.includes("crustacé") || n.includes("homard") || n.includes("marée")) return "seafood";

  if(priceLunch && priceLunch > 25) return "trad_high";
  if(type==="fast_food"||/tacos|kebab|burger|fast|pizza|sandwich|snack|boulangerie/.test(n))return "fast";
  if(/gastrono|michelin|palace|etoile|étoile|prestige/.test(n))return "gastronomy";
  if(/bistro|comptoir|brasserie/.test(n))return "bistro";
  if(/gastronomique|chic|chateau|château|grand |maison |table |auberge/.test(n))return "trad_high";
  return "trad_low"
}

// --- Unicité des pseudos ---
function normalizePseudoKey(p){
  return String(p||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9_.-]+/g,"_");
}

function claimPseudo(newPseudo, callback){
  var clean = String(newPseudo||"").trim();
  if(!clean){ callback(false, "Pseudo requis."); return; }
  if(clean.length > 30){ callback(false, "Pseudo trop long (30 caractères max)."); return; }
  var key = normalizePseudoKey(clean);
  if(!key){ callback(false, "Utilise des lettres ou chiffres pour ton pseudo."); return; }
  if(!S.fdb || !S.user || S.user.isAnonymous){
    callback(true, clean);
    return;
  }
  var docRef = S.fdb.collection("pseudos").doc(key);
  S.fdb.runTransaction(function(tx){
    return tx.get(docRef).then(function(snap){
      if(snap.exists && snap.data().uid && snap.data().uid !== S.user.uid){
        throw new Error("TAKEN");
      }
      var oldKey = S.pseudo ? normalizePseudoKey(S.pseudo) : "";
      if(oldKey && oldKey !== key){
        var oldRef = S.fdb.collection("pseudos").doc(oldKey);
        tx.delete(oldRef);
      }
      tx.set(docRef, {uid: S.user.uid, pseudo: clean, updatedAt: Date.now()});
    });
  }).then(function(){
    callback(true, clean);
  }).catch(function(err){
    if(err && err.message === "TAKEN"){
      callback(false, "Ce nom d'utilisateur est déjà pris. Choisis-en un autre !");
    } else {
      callback(false, "Impossible de vérifier la disponibilité du pseudo pour le moment.");
    }
  });
}

function genUniqueLeagueCode(){
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var part1 = "", part2 = "";
  for(var i = 0; i < 4; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
  for(var j = 0; j < 4; j++) part2 += chars.charAt(Math.floor(Math.random() * chars.length));
  return "LG-" + part1 + "-" + part2;
}

  if(S.leagues.indexOf(code) > -1){
    pick(code);

  S.fdb.collection("leagues").doc(code).get().then(function(doc){
    if(doc.exists){
      var d = doc.data() || {};
      if(d.name) S.leagueNames[code] = d.name;
      pick(code);

    }
    return S.fdb.collection("leagues/"+code+"/reviews").limit(1).get().then(function(q){
      if(!q.empty){
        pick(code);
        alert("Tu as rejoint la ligue « " + leagueLabel(code) + " » !");

  }).catch(function(){});
}

function keyOf(p){return p.pid||("n:"+p.n.toLowerCase().trim())}
function gmap(list){var g={};list.forEach(function(x){var k=x.pid||("n:"+x.resto.toLowerCase().trim());var o=g[k]=g[k]||{k:k,pid:x.pid,n:x.resto,a:"",s:0,c:0,sp:0,cp:0,sd:0,cd:0,t:0,cat:x.cat||getRestoCat(x.resto,x.type,x.priceLunch,x.cuisine),cuisine:x.cuisine||"",rv:[]};o.s+=x.note;o.c++;if(x.mode==="deliv"){o.sd+=x.note;o.cd++}else{o.sp+=x.note;o.cp++}o.rv.push(x);if(x.addr)o.a=x.addr;if(num(x.lat)&&num(x.lng)){o.lat=x.lat;o.lng=x.lng}if(x.ts>o.t)o.t=x.ts});return g}
function groups(list){var g=gmap(list);return Object.keys(g).map(function(k){return g[k]}).sort(function(a,b){return b.t-a.t})}

function sortP(arr){var g=gmap(allv());arr.forEach(function(p){var o=g[keyOf(p)];p.c=o?o.c:0;p.avg=o?o.s/o.c:-1;if(o&&o.cat)p.cat=o.cat;else if(!p.cat)p.cat=getRestoCat(p.n,p.type,p.priceLunch,p.cuisine);p.d=(S.loc&&num(p.lat)&&num(p.lng))?dist(S.loc.lat,S.loc.lng,p.lat,p.lng):(S.sc&&num(p.lat)&&num(p.lng))?dist(S.sc.lat,S.sc.lng,p.lat,p.lng):null});
return arr.sort(function(a,b){
  var so = S.filt.sort;
  if(so === "near") {
    function da(x){return x.d!=null?x.d:(x.dc!=null?x.dc:1e9)}
    return da(a)-da(b);
  }
  if(so === "worst") {
    var ax=a.avg<0?99:a.avg, ay=b.avg<0?99:b.avg;
    return ax-ay || ((a.d!=null?a.d:0)-(b.d!=null?b.d:0));
  }
  if(b.avg !== a.avg) return b.avg - a.avg;
  function dxy(x){return x.d!=null?x.d:(x.dc!=null?x.dc:1e9)}
  return dxy(a) - dxy(b);
})}

function strip(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim()}

var gmapsPromise = null;
function loadGoogleMaps(cb){
  if(window.google && window.google.maps && window.google.maps.places){ cb(); return; }
  if(!gmapsPromise){
    gmapsPromise = new Promise(function(resolve, reject){
      window._gmapsReady = function(){ resolve(); };
      var s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(GMAPS_KEY) + "&libraries=places&language=fr&region=FR&callback=_gmapsReady";
      s.async = true;
      s.onerror = function(){ gmapsPromise = null; reject(); };
      document.head.appendChild(s);
    });
  }
  gmapsPromise.then(cb).catch(function(){});
}

function priceLevelNewToCat(name, types, priceLevel){
  if(priceLevel === "PRICE_LEVEL_VERY_EXPENSIVE" || priceLevel === 4) return "gastronomy";
  if(priceLevel === "PRICE_LEVEL_EXPENSIVE" || priceLevel === 3) return "trad_high";
  if(priceLevel === "PRICE_LEVEL_INEXPENSIVE" || priceLevel === 1) return "fast";
  var t = (types || []).indexOf("meal_takeaway") > -1 ? "fast_food" : "restaurant";
  return getRestoCat(name, t, (priceLevel === "PRICE_LEVEL_MODERATE" || priceLevel === 2) ? 20 : null, "");
}

function mapNewPlaceToBelly(r){
  var lat = r.location ? (typeof r.location.lat === "function" ? r.location.lat() : r.location.lat) : null;
  var lng = r.location ? (typeof r.location.lng === "function" ? r.location.lng() : r.location.lng) : null;
  var n = r.displayName || "Restaurant";
  var addr = r.formattedAddress || "";
  var cat = priceLevelNewToCat(n, r.types, r.priceLevel);
  return {
    pid: "gp:" + r.id,
    gPlaceId: r.id,
    n: n,
    a: addr,
    lat: lat,
    lng: lng,
    type: (r.types || [])[0] || "restaurant",
    cuisine: "",
    cat: cat,
    gRating: r.rating || null,
    gCount: r.userRatingCount || 0
  };
}

function searchPlaces(q){
  S.mapC = null;
  S.smode = "poi";
  S.sc = null;
  S.slabel = "";
  var center = S.loc || S.home || {lat:48.8566, lng:2.3522};
  var rad = Math.max(S.filt.rad || 3000, 500);

  function mergeCommunity(list){
    var seen = {};
    list.forEach(function(p){ seen[keyOf(p)] = 1; });
    groups(allv()).forEach(function(o){
      if(seen[o.k]) return;
      var matchQ = !q || strip(o.n).indexOf(strip(q)) > -1 || strip(o.a).indexOf(strip(q)) > -1;
      var okDist = !num(o.lat) || !num(o.lng) || dist(center.lat, center.lng, o.lat, o.lng)*1000 <= rad * 2;
      if(matchQ && okDist){
        list.push({pid:o.pid, n:o.n, a:o.a, lat:o.lat, lng:o.lng, cat:o.cat, cuisine:o.cuisine||""});
      }
    });
    return list;
  }

  return new Promise(function(resolve){
    loadGoogleMaps(async function(){
      try {
        var PlaceClass = google.maps.places && google.maps.places.Place;
        if(!PlaceClass){ resolve(mergeCommunity([])); return; }
        var fields = ["id", "displayName", "location", "formattedAddress", "rating", "userRatingCount", "priceLevel", "types"];

        if(!q || q.length === 0){
          var resp = await PlaceClass.searchNearby({
            fields: fields,
            locationRestriction: { center: { lat: center.lat, lng: center.lng }, radius: rad },
            includedPrimaryTypes: ["restaurant", "cafe", "bakery", "meal_takeaway", "bar"],
            maxResultCount: 20,
            language: "fr"
          });
          var mapped = (resp && resp.places ? resp.places : []).map(mapNewPlaceToBelly);
          resolve(mergeCommunity(mapped));
        } else {
          var respT = await PlaceClass.searchByText({
            textQuery: q,
            fields: fields,
            locationBias: { center: { lat: center.lat, lng: center.lng }, radius: rad },
            maxResultCount: 20,
            language: "fr"
          });
          var mappedT = (respT && respT.places ? respT.places : []).map(mapNewPlaceToBelly);
          if(mappedT.length && num(mappedT[0].lat) && num(mappedT[0].lng)){
            S.sc = {lat: mappedT[0].lat, lng: mappedT[0].lng};
            S.mapC = {lat: mappedT[0].lat, lng: mappedT[0].lng};
          }
          resolve(mergeCommunity(mappedT));
        }
      } catch(e){
        resolve(mergeCommunity([]));
      }
    });
  });
}

function fetchGooglePlaceDetails(p){
  if(!p) return;
  var gpId = p.gPlaceId || (p.pid && p.pid.indexOf("gp:") === 0 ? p.pid.slice(3) : null);
  if(!gpId || S.gDetailsCache[gpId]) return;
  S.gDetailsCache[gpId] = {loading: true};
  loadGoogleMaps(async function(){
    try {
      var PlaceClass = google.maps.places && google.maps.places.Place;
      if(!PlaceClass) return;
      var placeObj = new PlaceClass({ id: gpId, requestedLanguage: "fr" });
      await placeObj.fetchFields({
        fields: ["rating", "userRatingCount", "reviews", "googleMapsURI", "formattedAddress"]
      });
      var revs = (placeObj.reviews || []).slice(0, 5).map(function(rv){
        return {
          author_name: (rv.authorAttribution && rv.authorAttribution.displayName) || "Utilisateur Google",
          relative_time_description: rv.relativePublishTimeDescription || "",
          rating: rv.rating || 0,
          text: rv.text || ""
        };
      });
      S.gDetailsCache[gpId] = {
        loading: false,
        rating: placeObj.rating || null,
        total: placeObj.userRatingCount || 0,
        reviews: revs,
        url: placeObj.googleMapsURI || ""
      };
      if(S.sel && keyOf(S.sel) === keyOf(p)){
        if(placeObj.formattedAddress && !S.sel.a) S.sel.a = placeObj.formattedAddress;
        render();
      }
    } catch(e){
      S.gDetailsCache[gpId] = {loading: false, error: true};
    }
  });
}

function applyFilt(arr){
  var f=S.filt;
  var a=(arr||[]).filter(function(p){
    var c=p.cat||getRestoCat(p.n,p.type,p.priceLunch,p.cuisine);
    var cui=p.cuisine||"";
    var matchCat = !f.cats.length || f.cats.indexOf(c)>-1;
    var matchCui = !f.cuisine.length || f.cuisine.some(function(ck){ return cui.toLowerCase().indexOf(ck)>-1 || c===ck; });
    if(f.cats.length && f.cuisine.length) return matchCat && matchCui;
    return matchCat || matchCui;
  });
  sortP(a);
  a.forEach(function(p){p.dc=(S.sc&&num(p.lat)&&num(p.lng))?dist(S.sc.lat,S.sc.lng,p.lat,p.lng):null});
  return a;
}

function fitResults(){
  if(!S.map || S.tab !== "map" || !window.google) return;
  try {
    var pts = (S.sr||[]).filter(function(p){return num(p.lat)&&num(p.lng)}).slice(0,12);
    if(pts.length > 1){
      var bounds = new google.maps.LatLngBounds();
      pts.forEach(function(p){ bounds.extend({lat: p.lat, lng: p.lng}); });
      S.map.fitBounds(bounds, 36);
      return;
    }
    if(pts.length === 1){
      S.map.setCenter({lat: pts[0].lat, lng: pts[0].lng});
      S.map.setZoom(16);
      return;
    }
    if(S.mapC){
      S.map.setCenter({lat: S.mapC.lat, lng: S.mapC.lng});
      S.map.setZoom(15);
    }
  } catch(e){}

function drawMarkers(){
  if(!S.map || !window.google) return;
  if(S.gMarkers){
    S.gMarkers.forEach(function(m){ if(m.getTitle() !== "Toi") m.setMap(null); });
    S.gMarkers = S.gMarkers.filter(function(m){ return m.getTitle() === "Toi"; });
  }
  S.mk = [];
  var g = gmap(allv()), seen = {};

  Object.keys(g).forEach(function(k){
    var o = g[k];
    if(!num(o.lat) || !num(o.lng)) return;
    seen[k] = 1;
    var i = S.mk.push(o) - 1;
    var col = getRestoColor(o);
    var mk = new google.maps.Marker({
      position: {lat: o.lat, lng: o.lng},
      map: S.map,
      title: o.n,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 9,
        fillColor: col,
        fillOpacity: 0.95,
        strokeColor: "#FFFFFF",
        strokeWeight: 2
      }
    });
    mk.addListener("click", function(){
      if(!S.gInfo) S.gInfo = new google.maps.InfoWindow();
      S.gInfo.setContent('<div style="padding:2px 4px"><b>'+esc(o.n)+'</b><br><span style="color:#E5B83F">'+stars(o.s/o.c)+'</span> '+(o.s/o.c).toFixed(1)+' ('+o.c+')<br><a href="#" onclick="openK('+i+');return false" style="font-weight:700;color:#192A3A">Voir les avis</a></div>');
      S.gInfo.open(S.map, mk);
    });
    S.gMarkers.push(mk);
  });

  var listToDraw = (S.sr || []);
  listToDraw.forEach(function(p){
    if(seen[keyOf(p)] || !num(p.lat) || !num(p.lng)) return;
    var col = getRestoColor(p);
    var mk = new google.maps.Marker({
      position: {lat: p.lat, lng: p.lng},
      map: S.map,
      title: p.n,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 7,
        fillColor: col,
        fillOpacity: 0.78,
        strokeColor: "#FFFFFF",
        strokeWeight: 1.5
      }
    });
    mk.addListener("click", function(){
      if(!S.gInfo) S.gInfo = new google.maps.InfoWindow();
      var gInfoStr = p.gRating ? '<br>Google : '+String(p.gRating).replace(".",",")+'★ ('+p.gCount+')' : '';
      S.gInfo.setContent('<div style="padding:2px 4px"><b>'+esc(p.n)+'</b><br>'+esc(p.a||"")+gInfoStr+'<br><a href="#" onclick="openR(\''+encodeURIComponent(p.pid)+'\');return false" style="font-weight:700;color:#192A3A">Voir la fiche</a></div>');
      S.gInfo.open(S.map, mk);
    });
    S.gMarkers.push(mk);
  });
}

function handlePhoto(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(evt){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var max_size=600;
      var width=img.width, height=img.height;
      if(width>height){if(width>max_size){height*=max_size/width;width=max_size;}}
      else{if(height>max_size){width*=max_size/height;height=max_size;}}
      canvas.width=width; canvas.height=height;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,width,height);
      S.form.photo=canvas.toDataURL('image/jpeg', 0.7);
      render();
    };
    img.src=evt.target.result;
  };
  reader.readAsDataURL(file);
}

function rank(list){var now=new Date(),m=now.getMonth(),y=now.getFullYear();
var G=groups(list.filter(function(x){var d=new Date(x.ts);return d.getMonth()===m&&d.getFullYear()===y})).sort(function(a,b){return b.s/b.c-a.s/a.c||b.c-a.c});
var h='<h2>Classement de '+esc(now.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}))+'</h2>';
if(!G.length)return h+'<div class="empty">Pas encore de classement ce mois-ci.</div>';
var med=["🥇","🥈","🥉"];
return h+G.map(function(x,i){return '<div class="card strict rank"><div class="pos">'+(med[i]||(i+1))+'</div><div style="flex:1"><div class="resto">'+esc(x.n)+dot(x)+'</div><div class="who">'+x.c+' avis</div></div><div><div class="stars">'+stars(x.s/x.c)+'</div><div class="who" style="text-align:right">'+(x.s/x.c).toFixed(1)+'/5</div></div></div>'}).join("")}

function leagueSuggestions(){
  var seen = {};
  var out = [];
  S.leagues.forEach(function(c){
    var lname = leagueLabel(c);
    lrev(c).forEach(function(x){
      if(!x.uid || x.uid === S.uid || isB(x.uid)) return;
      if(seen[x.uid]){
        if(seen[x.uid].leagues.indexOf(lname) < 0) seen[x.uid].leagues.push(lname);
        return;
      }
      seen[x.uid] = {
        uid: x.uid,
        pseudo: x.pseudo || "Membre",
        col: x.col || "",
        leagues: [lname]
      };
      out.push(seen[x.uid]);
    });
  });
  return out;
}

function searchUsersByPseudo(){
  var inp = document.getElementById("friend-sq");
  var q = inp ? inp.value.trim() : S.userSearchQ;
  S.userSearchQ = q;
  if(!q){
    S.userSearchRes = null;
    S.userSearchBusy = false;
    render();
    return;
  }
  var norm = normalizePseudoKey(q);
  if(!norm){
    S.userSearchRes = [];
    S.userSearchBusy = false;
    render();
    return;
  }
  if(!S.fdb){
    S.userSearchRes = [];
    S.userSearchBusy = false;
    render();
    return;
  }
  S.userSearchBusy = true;
  render();
  S.fdb.collection("pseudos")
    .orderBy(firebase.firestore.FieldPath.documentId())
    .startAt(norm)
    .endAt(norm + "\uf8ff")
    .limit(20)
    .get()
    .then(function(snap){
      var list = [];
      snap.forEach(function(doc){
        var d = doc.data() || {};
        if(d.uid && d.uid !== S.uid && !isB(d.uid)){
          list.push({uid: d.uid, pseudo: d.pseudo || doc.id});
        }
      });
      S.userSearchRes = list;
      S.userSearchBusy = false;
      render();
    })
    .catch(function(){
      S.userSearchRes = [];
      S.userSearchBusy = false;
      render();
    });
}

function leagueMembersList(code){
  var revs = lrev(code);
  var map = {};

  if(S.uid){
    map[S.uid] = {
      uid: S.uid,
      pseudo: S.pseudo || "Moi",
      col: S.col || hashColor(String(S.uid)),
      count: 0,
      lastTs: 0
    };
  }

  revs.forEach(function(x){
    if(!x.uid || isB(x.uid)) return;
    if(!map[x.uid]){
      map[x.uid] = {
        uid: x.uid,
        pseudo: x.pseudo || "Membre",
        col: x.col || colOf(x),
        count: 0,
        lastTs: 0
      };
    }
    map[x.uid].count++;
    if((x.ts || 0) > map[x.uid].lastTs){
      map[x.uid].lastTs = x.ts || 0;
      if(x.pseudo) map[x.uid].pseudo = x.pseudo;
      if(x.col) map[x.uid].col = x.col;
    }
  });

  var list = Object.keys(map).map(function(k){ return map[k]; });
  list.sort(function(a,b){
    if(a.uid === S.uid) return -1;
    if(b.uid === S.uid) return 1;
    return (b.count - a.count) || ((b.lastTs || 0) - (a.lastTs || 0));
  });

  if(!list.length){
    return '<div class="empty">Aucun membre trouvé dans cette ligue.</div>';
  }

  return '<h2>Membres de la ligue ('+list.length+')</h2>' + list.map(function(m){
    var isMe = m.uid === S.uid;
    var following = !isMe && hasFriend(m.uid);
    var followsMe = !isMe && isFollower(m.uid);
    var mutual = following && followsMe;
    var avBg = m.col || hashColor(String(m.uid || m.pseudo));
    var badge = isMe
      ? '<span class="status-badge">Moi</span>'
      : (mutual ? '<span class="status-badge">Ami</span>' : (following ? '<span class="status-badge">Suivi</span>' : ''));
    var subTxt = m.count + ' avis dans cette ligue' + (!isMe && followsMe && !following ? ' · Te suit' : '');
    var actionBtn = '';

    if(!isMe){
      actionBtn = following
        ? '<button class="chip" onclick="event.stopPropagation();delFriend(\''+esc(m.uid)+'\')">'+(mutual?'✓ Ami':'Suivi')+'</button>'
        : '<button class="chip on" onclick="event.stopPropagation();addFriend(\''+esc(m.uid)+'\',\''+esc(m.pseudo)+'\')">'+(followsMe?'Suivre en retour':'+ Suivre')+'</button>';
    }

    return '<div class="friend-row-card">' +
      '<div class="friend-av" style="background:'+avBg+'" onclick="openUser(\''+encodeURIComponent(m.uid)+'\',\''+encodeURIComponent(m.pseudo)+'\')">'+esc((m.pseudo||"?").charAt(0).toUpperCase())+'</div>' +
      '<div class="friend-meta" onclick="openUser(\''+encodeURIComponent(m.uid)+'\',\''+encodeURIComponent(m.pseudo)+'\')">' +
        '<div class="friend-name">'+esc(m.pseudo)+badge+'</div>' +
        '<div class="friend-sub">'+esc(subTxt)+'</div>' +
      '</div>' +
      actionBtn +
    '</div>';
  }).join("");
}

function createLeague(){
  var nameEl = document.getElementById("lgn");
  var customName = nameEl ? nameEl.value.trim().slice(0, 40) : "";
  if(!S.fdb){
    var fallbackCode = genUniqueLeagueCode();
    if(customName) S.leagueNames[fallbackCode] = customName;
    pick(fallbackCode);
    alert("Nouvelle ligue créée ! Code : " + fallbackCode);
    return;
  }
  function tryGenerate(attempts){
    if(attempts <= 0){ alert("Impossible de générer un code unique, réessaie."); return; }
    var code = genUniqueLeagueCode();
    var ref = S.fdb.collection("leagues").doc(code);
    ref.get().then(function(doc){
      if(doc.exists){
        tryGenerate(attempts - 1);
        return;
      }
      var payload = {
        code: code,
        name: customName || "",
        createdBy: S.uid,
        createdAt: Date.now()
      };
      ref.set(payload).then(function(){
        if(customName) S.leagueNames[code] = customName;
        pick(code);
        alert("Ligue créée ! Clique sur « Inviter » pour partager le lien.");
      }).catch(function(){
        alert("Création impossible pour le moment.");
      });
    }).catch(function(){
      alert("Erreur de connexion.");
    });
  }
  tryGenerate(5);
}

function leaveLeague(c){if(!confirm("Quitter la ligue « "+leagueLabel(c)+" » ?"))return;var i=S.leagues.indexOf(c);if(i>-1)S.leagues.splice(i,1);if(S.unsubs[c]){try{S.unsubs[c]()}catch(e){}delete S.unsubs[c]}delete S.priv[c];if(S.leagueNames&&S.leagueNames[c])delete S.leagueNames[c];if(S.form.tls)S.form.tls=S.form.tls.filter(function(x){return x!==c});if(S.league===c)S.league=S.leagues[0]||"";S.leagueOpen=false;save();render()}

function join(){
  var inp = document.getElementById("lg");
  var raw = inp ? inp.value.trim() : "";
  var l = raw;
  var m = raw.match(/[?&]join=([^&]+)/i);
  if(m && m[1]){
    try { l = decodeURIComponent(m[1]); } catch(e){ l = m[1]; }
  }
  l = l.trim().toUpperCase().replace(/\s+/g,"-").replace(/[\/.]/g,"");
  if(!l){alert("Entre un code de ligue");return}
  if(S.leagues.indexOf(l) > -1){
    pick(l);
    return;
  }
  if(!S.fdb){
    alert("Connexion requise pour vérifier qu'une ligue existe avec ce code.");
    return;
  }
  S.fdb.collection("leagues").doc(l).get().then(function(doc){
    if(doc.exists){
      var d = doc.data() || {};
      if(d.name) S.leagueNames[l] = d.name;
      pick(l);
      return;
    }
    return S.fdb.collection("leagues/"+l+"/reviews").limit(1).get().then(function(q){
      if(!q.empty){
        pick(l);
      } else {
        alert("Aucune ligue trouvée avec le code « " + l + " ». Vérifie le code exact ou crée une nouvelle ligue.");
      }
    });
  }).catch(function(){
    alert("Vérification impossible pour le moment.");
  });
}

function pick(l){S.league=l;if(S.leagues.indexOf(l)<0)S.leagues.push(l);S.lgTab="leagues";S.leagueOpen=true;save();subL();S.tab="league";render()}

function share(c){
  var url = leagueInviteUrl(c);
  var nm = S.leagueNames && S.leagueNames[c];
  try {
    if(navigator.share){
      navigator.share({
        title: nm ? ("Rejoins " + nm + " sur Belly") : "Invitation Belly",
        url: url
      });
      return;
    }
  } catch(e){}
  try {
    navigator.clipboard.writeText(url);
    alert("Lien d'invitation copié :\n" + url);
  } catch(e){
    prompt("Copie ce lien d'invitation :", url);
  }
}

function hex(r,g,b){return "#"+[r,g,b].map(function(v){return ("0"+v.toString(16)).slice(-2)}).join("")}
function newColor(){function c(){return 50+Math.floor(Math.random()*151)}return hex(c(),c(),c())}
function hashColor(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return hex(50+h%151,50+(h>>>8)%151,50+(h>>>16)%151)}
function colOf(x){return x.col||hashColor(String(x.uid||x.pseudo||"?"))}
function newCol(){S.col=newColor();save();render()}
function tl(n){return 'background:'+hashColor(n||"?")}
function ini(n){return esc(((n||"").replace(/[^A-Za-zÀ-ÿ0-9 ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w.charAt(0).toUpperCase()}).join(""))||"")}
function pl(x){var o={pid:x.pid,n:x.resto,a:x.addr||"",cat:x.cat||getRestoCat(x.resto,x.type,x.priceLunch,x.cuisine)};if(num(x.lat)&&num(x.lng)){o.lat=x.lat;o.lng=x.lng}return o}
function cp(p){var o={pid:p.pid||("n:"+p.n.toLowerCase().trim()),n:p.n,a:p.a||"",cat:p.cat||getRestoCat(p.n,p.type,p.priceLunch,p.cuisine)};if(num(p.lat)&&num(p.lng)){o.lat=p.lat;o.lng=p.lng}return o}
function has(l,p){var k=keyOf(p);return l.some(function(x){return keyOf(x)===k})}
function tgl(l,p){var k=keyOf(p),i=-1;l.forEach(function(x,j){if(keyOf(x)===k)i=j});if(i>-1)l.splice(i,1);else l.unshift(cp(p));save();render()}

function togW(){tgl(S.wish,S.sel)}
function hasFriend(uid){return S.friends.some(function(f){return f.uid===uid})}
function isFollower(uid){return (S.followers||[]).some(function(f){return f.uid===uid})}
function isMutualFriend(uid){return hasFriend(uid) && isFollower(uid)}

function addFriend(uid,pseudo){
  if(!uid || uid === S.uid) return;
  if(!hasFriend(uid)){
    S.friends.push({uid:uid,pseudo:pseudo||"Utilisateur"});
    save();
    if(S.fdb && S.uid){
      S.fdb.collection("follows").doc(S.uid+"__"+uid).set({
        from: S.uid,
        fromPseudo: S.pseudo || "Utilisateur",
        to: uid,
        toPseudo: pseudo || "Utilisateur",
        ts: Date.now()
      }).catch(function(){});
    }
    render();
  }
}

function delFriend(uid){
  S.friends=S.friends.filter(function(f){return f.uid!==uid});

// --- Modale "Noter" style Letterboxd ---
function getRecentSearches(){
  try { return JSON.parse(localStorage.getItem("lr_recent_searches") || "[]"); }
  catch(e){ return []; }
}

function saveRecentSearch(term){
  if(!term) return;
  var t = String(term).trim();
  if(t.length < 2) return;
  var list = getRecentSearches().filter(function(x){ return String(x).toLowerCase() !== t.toLowerCase(); });
  list.unshift(t);
  try { localStorage.setItem("lr_recent_searches", JSON.stringify(list.slice(0, 8))); } catch(e){}
}

function openNoteSheet(){
  S.noteOpen = true;
  S.prevTab = S.tab;
  if(!S.form) S.form = {note:0, avis:"", mode:"place", st:[], vis:"pub", tls:S.league?[S.league]:[], cat:"trad_low", cuisine:""};
  S.form.place = null;
  S.manual = false;
  S.sq = "";
  S.sr = null;
  renderNoteSheet();
  setTimeout(function(){
    var inp = document.getElementById("lb-note-inp");
    if(inp) inp.focus();
  }, 60);
}

function closeNoteSheet(){
  S.noteOpen = false;
  S.manual = false;
  if(S.tab === "add" && S.prevTab && S.prevTab !== "add"){
    S.tab = S.prevTab;
  }
  var el = document.getElementById("lb-note-modal");
  if(el) el.remove();
  render();
}

function onNoteSearchInput(val){
  S.sq = val;
  if(!val || !val.trim()){
    S.sr = null;
    updateNoteSheetBody();
    return;
  }
  S.busy = true;
  updateNoteSheetBody();
  searchPlaces(val.trim()).then(function(r){
    S.sr = applyFilt(r);
    S.busy = false;
    updateNoteSheetBody();
  }).catch(function(){
    S.sr = [];
    S.busy = false;
    updateNoteSheetBody();
  });
}

function onNoteSearchKeydown(e){
  if(e && e.key === "Enter"){
    e.preventDefault();
    if(S.sq && String(S.sq).trim()){
      saveRecentSearch(S.sq);
    }
    var inp = document.getElementById("lb-note-inp");
    if(inp) inp.blur();
  }
}

function pickRecentSearch(term){
  S.sq = term;
  var inp = document.getElementById("lb-note-inp");
  if(inp) inp.value = term;
  onNoteSearchInput(term);
}

function updateNoteSheetBody(){
  var body = document.getElementById("lb-sheet-body");
  var searchBox = document.querySelector(".lb-sheet-search");
  if(!body) return;
  var f = S.form;

  if(f && f.place){
    if(searchBox) searchBox.style.display = "none";
    var h = add();
    body.innerHTML = h.replace("<h2>J’ai mangé où ?</h2>", "");
    return;
  }

  if(S.manual){
    if(searchBox) searchBox.style.display = "none";
    body.innerHTML = '<div class="card strict"><div class="sub">Ajoute ton resto toi-même :</div><input id="mn" placeholder="Nom du restaurant" value="'+esc(S.sq)+'"><input id="ma" placeholder="Adresse"><button class="btn" onclick="manualOk()">Continuer</button><button class="back" onclick="S.manual=false;render()">← Retour</button></div>';
    return;
  }

  if(searchBox) searchBox.style.display = "block";

  if(!S.sq || !String(S.sq).trim()){
    var recents = getRecentSearches();
    var recHtml = recents.length
      ? '<div class="lb-recent-title">Recherches récentes</div>' +
        recents.map(function(r){
          var safe = String(r).replace(/'/g, "\\'");
          return '<div class="lb-recent-row" onclick="pickRecentSearch(\''+safe+'\')"><span>'+esc(r)+'</span></div>';
        }).join("")
      : '<div class="empty">C’est désert ici ! Tape le nom d’un restaurant ci-dessus.</div>';
    body.innerHTML = locCard() + recHtml;
    return;
  }

  body.innerHTML = "<div id='res'>" + resHTML() + "</div>";
}

function renderNoteSheet(){
  var old = document.getElementById("lb-note-modal");
  if(old) old.remove();
  if(!S.noteOpen) return;

  var modal = document.createElement("div");
  modal.id = "lb-note-modal";
  modal.className = "lb-modal";
  modal.innerHTML =
    '<div class="lb-sheet">' +
      '<div class="lb-sheet-hd">' +
        '<button type="button" class="cancel-btn" onclick="closeNoteSheet()">Annuler</button>' +
        '<div class="sheet-title">Noter un resto</div>' +
        '<div style="width:55px"></div>' +
      '</div>' +
      '<div class="lb-sheet-search">' +
        '<input id="lb-note-inp" type="search" placeholder="Nom du restaurant, adresse..." value="'+esc(S.sq||"")+'" oninput="onNoteSearchInput(this.value)" onkeydown="onNoteSearchKeydown(event)">' +
      '</div>' +
      '<div id="lb-sheet-body" class="lb-sheet-body"></div>' +
    '</div>';
  document.body.appendChild(modal);
  updateNoteSheetBody();
}

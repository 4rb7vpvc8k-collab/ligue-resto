function confirmRep(k){var x=S.rx;closeSheet();if(!x||!S.fdb)return;var rid=ridOf(x),u=S.user.uid;
S.fdb.collection("reports").doc(u+"__"+rid).set({rid:rid,path:x._p?"leagues/"+x._lg+"/reviews/"+x._id:"reviews/"+x._id,reporter:u,reviewUid:x.uid,reason:REASONS[k],resto:x.resto,avis:x.avis||"",ts:Date.now()})
.then(function(){return S.fdb.collection("flags").doc(rid).set({by:firebase.firestore.FieldValue.arrayUnion(u)},{merge:true})})

function blk(i){var x=S.rvl[i];if(!x)return;if(!confirm("Bloquer "+(x.pseudo||"cet utilisateur")+" ?"))return;S.blocked.push({u:x.uid,n:x.pseudo||"?"});save();render()}
function unblk(k){S.blocked.splice(k,1);save();render()}
function keyOf(p){return p.pid||("n:"+p.n.toLowerCase().trim())}
function gmap(list){var g={};list.forEach(function(x){var k=x.pid||("n:"+x.resto.toLowerCase().trim());var o=g[k]=g[k]||{k:k,pid:x.pid,n:x.resto,a:"",s:0,c:0,sp:0,cp:0,sd:0,cd:0,t:0,cat:x.cat||getRestoCat(x.resto,x.type),rv:[]};o.s+=x.note;o.c++;if(x.mode==="deliv"){o.sd+=x.note;o.cd++}else{o.sp+=x.note;o.cp++}o.rv.push(x);if(x.addr)o.a=x.addr;if(num(x.lat)&&num(x.lng)){o.lat=x.lat;o.lng=x.lng}if(x.ts>o.t)o.t=x.ts});return g}
function groups(list){var g=gmap(list);return Object.keys(g).map(function(k){return g[k]}).sort(function(a,b){return b.t-a.t})}
function sortP(arr){var g=gmap(allv());arr.forEach(function(p){var o=g[keyOf(p)];p.c=o?o.c:0;p.avg=o?o.s/o.c:-1;if(o&&o.cat)p.cat=o.cat;else if(!p.cat)p.cat=getRestoCat(p.n,p.type);p.d=(S.loc&&num(p.lat)&&num(p.lng))?dist(S.loc.lat,S.loc.lng,p.lat,p.lng):null});
return arr.sort(function(a,b){if(S.loc&&a.d!=null&&b.d!=null)return a.d-b.d;return b.avg-a.avg||b.c-a.c||a.n.localeCompare(b.n)})}
function addrOf(x){var a=x.address||{},l1=((a.house_number?a.house_number+" ":"")+(a.road||"")).trim(),l2=((a.postcode||"")+" "+(a.city||a.town||a.village||a.municipality||"")).trim();var r=[l1,l2].filter(Boolean).join(", ");return r||(x.display_name||"").split(",").slice(1,3).join(",").trim()}
function conv(list){return (list||[]).filter(function(x){return x.category==="amenity"&&FOOD.indexOf(x.type)>-1}).map(function(x){var n=x.name||(x.display_name||"").split(",")[0];return{pid:"osm:"+(x.osm_type||"x").charAt(0)+x.osm_id,n:n,a:addrOf(x),lat:parseFloat(x.lat),lng:parseFloat(x.lon),type:x.type,cat:getRestoCat(n,x.type)}})}
function nomRaw(q){var u="https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=40&accept-language=fr&q="+encodeURIComponent(q);
var c=S.loc||S.home;if(c){var d=S.loc?.5:1;u+="&viewbox="+[c.lng-d,c.lat+d,c.lng+d,c.lat-d].join(",")}
return fetch(u).then(function(r){return r.json()}).catch(function(){return[]})}
function areaKind(x){var c=x.category,t=x.type;if(c==="amenity"&&FOOD.indexOf(t)>-1)return "";if(c==="highway")return "street";if(c==="building"||t==="house"||(x.address&&x.address.house_number&&c!=="amenity"))return "address";if(t==="postcode"||t==="postal_code")return "postcode";if(c==="place"||c==="boundary")return "city";return ""}
function strip(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function bboxOf(x,span){var b=(x.boundingbox||[]).map(parseFloat);if(b.length<4||b.some(isNaN)){var la=parseFloat(x.lat),ln=parseFloat(x.lon);b=[la-.01,la+.01,ln-.015,ln+.015]}var s=b[0],n=b[1],w=b[2],e=b[3],cy=(s+n)/2,cx=(w+e)/2;
if(n-s>span){s=cy-span/2;n=cy+span/2}if(e-w>span){w=cx-span/2;e=cx+span/2}if(n-s<.01){s=cy-.005;n=cy+.005}if(e-w<.015){w=cx-.0075;e=cx+.0075}return [s,w,n,e]}
var AM='nwr["amenity"~"^(restaurant|cafe|fast_food|bar|pub|food_court|ice_cream)$"]';
function ovAddr(t){var l1=((t["addr:housenumber"]?t["addr:housenumber"]+" ":"")+(t["addr:street"]||"")).trim(),l2=((t["addr:postcode"]||"")+" "+(t["addr:city"]||"")).trim();return [l1,l2].filter(Boolean).join(", ")}
var OVS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
function ovFetch(q,i){i=i||0;var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},9000);return fetch(OVS[i],{method:"POST",body:"data="+encodeURIComponent(q),signal:ctl.signal}).then(function(r){clearTimeout(t);if(r.ok===false)throw 0;return r.json()}).catch(function(e){clearTimeout(t);if(i+1<OVS.length)return ovFetch(q,i+1);return {elements:[]}})}
function ovPost(q){return ovFetch(q).then(function(j){return (j.elements||[]).filter(function(e){return e.tags&&e.tags.name&&(e.lat!=null||e.center)}).map(function(e){var n=e.tags.name;return{pid:"osm:"+e.type.charAt(0)+e.id,n:n,a:ovAddr(e.tags),lat:e.lat!=null?e.lat:e.center.lat,lng:e.lon!=null?e.lon:e.center.lon,type:e.tags.amenity,cat:getRestoCat(n,e.tags.amenity)}})})
}
function areaSearch(kind,ar){var lat=parseFloat(ar.lat),lng=parseFloat(ar.lon),R=S.filt.rad,c={lat:lat,lng:lng},nm=(ar.name||(ar.display_name||"").split(",")[0]||"").replace(/"/g,""),b=(kind==="city"||kind==="postcode")?bboxOf(ar,.12):null;
S.smode=kind;S.sc=c;S.mapC=c;S.slabel=(ar.display_name||"").split(",").slice(0,2).join(",").trim();var pr;
if(b)pr=ovPost('[out:json][timeout:12];'+AM+'('+b.join(",")+');out center 120;');
else if(kind==="street"){var pre='[out:json][timeout:12];way["highway"]["name"="'+nm+'"](around:1500,'+lat+','+lng+')->.s;';
pr=ovPost(pre+AM+'(around.s:'+R+');out center 100;').then(function(r){r.forEach(function(p){p.on=strip(p.a).indexOf(strip(nm))>-1});return r})}
else pr=ovPost('[out:json][timeout:12];'+AM+'(around:'+R+','+lat+','+lng+');out center 100;');
return pr.catch(function(){return[]}).then(function(list){var seen={};list.forEach(function(p){seen[p.pid]=1});
groups(allv()).forEach(function(o){if(!num(o.lat)||!num(o.lng))return;var k=o.pid||("n:"+o.n.toLowerCase().trim());if(seen[k])return;
var ok=b?(o.lat>=b[0]&&o.lat<=b[2]&&o.lng>=b[1]&&o.lng<=b[3]):dist(lat,lng,o.lat,o.lng)*1000<=R;if(!ok)return;
var p={pid:o.pid,n:o.n,a:o.a,lat:o.lat,lng:o.lng,cat:o.cat};if(kind==="street")p.on=strip(o.a).indexOf(strip(nm))>-1;list.push(p)});return list})}

function searchPlaces(q){S.mapC=null;S.smode="poi";S.sc=null;S.slabel="";return nomRaw(q).then(function(raw){if(!raw||!raw.length)return[];var top=raw[0],kind=areaKind(top),poi=conv(raw);
if(kind)return areaSearch(kind,top);if(poi.length)return poi;return areaSearch("address",top)})}

function applyFilt(arr){var f=S.filt,m=S.smode;var a=arr.filter(function(p){return !f.cats.length||f.cats.indexOf(p.cat||getRestoCat(p.n,p.type))>-1});sortP(a);
a.forEach(function(p){p.dc=(S.sc&&num(p.lat)&&num(p.lng))?dist(S.sc.lat,S.sc.lng,p.lat,p.lng):null});
var so=f.sort==="auto"?((m==="poi"&&S.loc)?"near":"best"):f.sort;
function dd(p){return p.d!=null?p.d:(p.dc!=null?p.dc:1e9)}
return a.sort(function(x,y){if(m==="street"&&!!x.on!==!!y.on)return x.on?-1:1;
if(so==="near")return dd(x)-dd(y);
if(so==="worst"){var ax=x.avg<0?99:x.avg,ay=y.avg<0?99:y.avg;return ax-ay||y.c-x.c||dd(x)-dd(y)}
return y.avg-x.avg||y.c-x.c||dd(x)-dd(y)})}

function doSearch(){var i=document.getElementById("sq"),q=i?i.value.trim():S.sq;if(q.length<2){alert("Écris au moins 2 lettres");return}
S.sq=q;S.busy=true;S.sr=null;S.err=false;S.manual=false;upRes();
searchPlaces(q).then(function(r){S.sr=applyFilt(r);S.busy=false;upRes();if(S.tab==="map"){drawMarkers();fitResults()}}).catch(function(){S.busy=false;S.err=true;S.sr=[];upRes()})}

function fitResults(){if(!S.map||S.tab!=="map")return;try{if(S.mapC){S.map.setView([S.mapC.lat,S.mapC.lng],16);return}
var pts=(S.sr||[]).filter(function(p){return num(p.lat)&&num(p.lng)}).slice(0,10).map(function(p){return[p.lat,p.lng]});if(pts.length)S.map.fitBounds(pts,{maxZoom:16,padding:[24,24]})}catch(e){}}

(S.sr||[]).forEach(function(p,i){if(seen[keyOf(p)]||!num(p.lat)||!num(p.lng))return;

function hex(r,g,b){return "#"+[r,g,b].map(function(v){return ("0"+v.toString(16)).slice(-2)}).join("")}
function newColor(){function c(){return 50+Math.floor(Math.random()*151)}return hex(c(),c(),c())}
function hashColor(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return hex(50+h%151,50+(h>>>8)%151,50+(h>>>16)%151)}

h+='<div class="sh">Derniers avis</div>'+(mine.length?'<div class="gr">'+mine.slice(0,4).map(function(x){return '<div onclick="openO('+hp(pl(x))+')"><div class="pt" style="'+tl(x.resto)+'">'+dot(x,'position:absolute;top:6px;right:6px')+'<b>'+ini(x.resto)+'</b><small>'+esc(x.resto)+'</small></div><div class="pm"><span class="stars">'+stars(x.note)+'</span></div></div>'}).join("")+'</div>':'<div class="sub">Aucun avis.</div>');
return h+'<div class="lr" onclick="S.sub=\'rest\';render()" style="margin-top:14px"><span>Restaurants</span><b>'+mr.length+' ›</b></div><div class="lr" onclick="S.sub=\'likes\';render()"><span>Likes</span><b>'+S.likes.length+' ›</b></div><div class="lr" onclick="S.sub=\'friends\';render()"><span>Amis</span><b>'+S.friends.length+' ›</b></div>'}

function loadv(){return '<div class="empty">Chargement…</div>'}
function welcome(){var up=S.wm==="up";
return '<div class="card strict"><div class="seg"><button class="chip '+(!up?"on":"")+'" onclick="S.wm=\'in\';render()">Connexion</button><button class="chip '+(up?"on":"")+'" onclick="S.wm=\'up\';render()">Inscription</button></div>'+(up?'<input id="wps" placeholder="Ton pseudo" value="'+esc(S.pseudo)+'">':'')+'<input id="wem" type="email" placeholder="E-mail"><input id="pw" type="password" placeholder="Mot de passe"><button class="btn" onclick="wSubmit()">'+(up?"Créer mon compte":"Se connecter")+'</button>'+(up?'':'<button class="back" onclick="resetPw()">Mot de passe oublié ?</button>')+'</div><div style="text-align:center"><button class="back" onclick="S.guest=true;render()">Continuer sans compte</button></div>'}
function onb(){return '<h2>Bienvenue '+esc(S.pseudo)+' 👋</h2><div class="card strict"><div class="sub">📍 Position :</div>'+(S.loc?'<div class="sub">✅ Activée</div>':'<button class="btn" onclick="getLoc()">Activer</button>')+'<input id="odp" placeholder="Département ou ville" value="'+esc(S.dept)+'" oninput="S.dept=this.value"><button class="btn" onclick="onbDone()">Continuer</button><button class="back" onclick="S.dept=\'\';onbDone()">Passer</button></div>'}
function geocode(q,cb){fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=fr&countrycodes=fr&q="+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(a){cb(a&&a[0]?{lat:parseFloat(a[0].lat),lng:parseFloat(a[0].lon)}:null)}).catch(function(){cb(null)})}
function onbDone(){var d=(S.dept||"").trim(),u=S.user;function fin(){if(u)ls("lr_onb_"+u.uid,"1");S.tab="home";save();render()}
if(!d){S.home=null;fin();return}geocode(d,function(h){if(h)S.home=h;fin()})}
function setHome(){var d=val("dp");S.dept=d;if(!d){S.home=null;save();render();return}geocode(d,function(h){if(h)S.home=h;save();render()})}
function wSubmit(){var up=S.wm==="up",e=val("wem"),p=val("pw"),n=up?val("wps"):"";
if(!e||!p||(up&&!n)){alert("Champs requis");return}
var a=firebase.auth();if(!up){a.signInWithEmailAndPassword(e,p).catch(authErr);return}
(a.currentUser&&a.currentUser.isAnonymous?a.currentUser.linkWithCredential(firebase.auth.EmailAuthProvider.credential(e,p)):a.createUserWithEmailAndPassword(e,p)).then(function(u){S.user=u.user||u;S.uid=S.user.uid;S.pseudo=n;S.col=newColor();S.profLoaded=true;S.guest=false;save();render()}).catch(authErr)}
function val(i){var e=document.getElementById(i);return e?e.value.trim():""}
function authErr(e){alert("Erreur d'authentification : "+(e.code||"inconnue"))}
function resetPw(){var e=val("wem");if(!e){alert("Entre ton e-mail");return}firebase.auth().sendPasswordResetEmail(e).then(function(){alert("E-mail envoyé ✉️")}).catch(authErr)}
function logout(){S.user=null;S.pseudo="";S.leagues=[];S.league="";S.priv={};S.dept="";S.home=null;S.blocked=[];S.likes=[];S.wish=[];S.friends=[];S.top=[null,null,null,null,null];S.bio="";S.col=newColor();S.profLoaded=false;S.guest=false;save();firebase.auth().signOut().then(function(){S.tab="me";render()})}
function delAcc(){if(!confirm("Supprimer ton compte ?"))return;var u=firebase.auth().currentUser;S.fdb.collection("users").doc(u.uid).delete().catch(function(){}).then(function(){return u.delete()}).then(function(){logout()}).catch(function(){alert("Suppression impossible.")})}
function setP(){var p=document.getElementById("ps").value.trim();if(!p){alert("Pseudo requis");return}S.pseudo=p;save();S.pt="prof";S.tab="home";render()}

function allv(){var a=S.all.slice();Object.keys(S.priv).forEach(function(c){a=a.concat(S.priv[c])});var seen={};return a.filter(vis).filter(function(x){var k=x._id||(x.uid+'|'+x.ts+'|'+(x.pid||x.resto));if(seen[k])return false;seen[k]=1;return true})}
function lrev(c){return S.all.filter(function(x){return lg(x).indexOf(c)>-1}).concat(S.priv[c]||[]).filter(vis)}
function subL(){if(!S.fdb)return;S.leagues.forEach(function(c){if(S.unsubs[c])return;S.unsubs[c]=S.fdb.collection("leagues/"+c+"/reviews").onSnapshot(function(q){S.priv[c]=q.docs.map(function(d){var x=d.data();x._p=true;x._lg=c;x._id=d.id;return x});refresh()},function(){})})}

function loadScripts(u,i,done){if(i>=u.length){done();return}var s=document.createElement("script");s.src=u[i];s.onload=function(){loadScripts(u,i+1,done)};s.onerror=function(){S.state="error";render()};document.head.appendChild(s)}
var base="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/";
function startDB(){S.fdb=firebase.firestore();S.state="ready";
S.fdb.collection("reviews").orderBy("ts","desc").limit(300).onSnapshot(function(q){S.all=q.docs.map(function(d){var x=d.data();x._id=d.id;return x});S.state="ready";refresh()},function(){S.state="error";render()});
S.fdb.collection("flags").onSnapshot(function(q){S.flags={};q.docs.forEach(function(d){S.flags[d.id]=(d.data().by||[]).length});refresh()},function(){});subL()}

function loadProfile(u){S.fdb.collection("users").doc(u.uid).get().then(function(d){var p=d.exists?d.data():{};
if(p.pseudo){S.pseudo=p.pseudo;ls("lr_onb_"+u.uid,"1")}(p.leagues||[]).forEach(function(c){if(S.leagues.indexOf(c)<0)S.leagues.push(c)});
if(!S.league&&S.leagues.length)S.league=S.leagues[0];(p.blocked||[]).forEach(function(b){if(!isB(b.u))S.blocked.push(b)});if(p.likes)S.likes=p.likes;if(p.wish)S.wish=p.wish;if(p.friends)S.friends=p.friends;if(p.top)S.top=p.top;if(p.bio)S.bio=p.bio;if(p.col)S.col=p.col;if(p.dept)S.dept=p.dept;if(p.home)S.home=p.home;save();subL()}).catch(function(){}).then(function(){S.profLoaded=true;S.authReady=true;S.tab=S.pseudo?"home":"me";render()})}

render();
try{if(navigator.permissions)navigator.permissions.query({name:"geolocation"}).then(function(r){if(r.state==="granted")getLoc()}).catch(function(){})}catch(e){}
loadScripts([base+"firebase-app-compat.min.js",base+"firebase-auth-compat.min.js",base+"firebase-firestore-compat.min.js"],0,function(){
try{firebase.initializeApp(CFG);firebase.auth().onAuthStateChanged(function(u){
if(!u){S.user=null;firebase.auth().signInAnonymously().catch(function(){S.state="error";render()});return}
S.user=u;S.uid=u.uid;if(!S.fdb)startDB();
if(!u.isAnonymous)loadProfile(u);else{S.authReady=true;render()}})}catch(e){S.state="error";render()}});
</script>
